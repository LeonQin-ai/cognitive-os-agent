name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64 package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Build release binary
        run: make -j"$(nproc)" build/cognitive-os-agent
      - name: Create portable package
        run: |
          mkdir -p release/cognitive-os-agent-linux-x64
          cp build/cognitive-os-agent release/cognitive-os-agent-linux-x64/
          cp README.md release/cognitive-os-agent-linux-x64/
          tar -C release -czf cognitive-os-agent-linux-x64.tar.gz cognitive-os-agent-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: backend/cognitive-os-agent-linux-x64.tar.gz

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Set up Zig
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP\zig" -Force
          "$env:RUNNER_TEMP\zig\zig-x86_64-windows-0.14.1" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Create installer
        run: bash package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: backend/dist/cognitive-os-agent-setup.exe

  macos:
    name: macOS ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            source_arch: arm64
          - runner: macos-15-intel
            arch: x64
            source_arch: x86_64
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Create native app package
        run: bash package-macos.sh
      - name: Normalize archive name
        run: mv dist/Cognitive-OS-macos-${{ matrix.source_arch }}.zip dist/cognitive-os-agent-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: backend/dist/cognitive-os-agent-macos-${{ matrix.arch }}.zip

  publish:
    name: Publish GitHub Release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## v0.7.0

          - 支持将 SKILL.md 和 MCP JSON 直接复制到本地 state/skills、state/mcp 目录，并在界面中重新加载
          - 支持从配置文件直接启动 CLI；增强 SSH 密码登录、命名环境和会话隔离
          - 优化聊天会话切换后的输入焦点、Skills/MCP 页面和 Agent 执行反馈
          - 修复共享记忆提交时机、任务恢复与调度相关问题

          发布前 CI 已覆盖 Windows、Linux、macOS Apple Silicon/Intel 和 AddressSanitizer。

          ### 安装包
          - Windows：`cognitive-os-agent-setup.exe`
          - Linux：`cognitive-os-agent-linux-x64.tar.gz`
          - macOS Apple Silicon：`cognitive-os-agent-macos-arm64.zip`
          - macOS Intel：`cognitive-os-agent-macos-x64.zip`
          EOF
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
