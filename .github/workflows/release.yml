name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Build release binary
        run: make -j"$(nproc)" build/cognitive-os-agent build/cognitive-os-agent-test
      - name: Native architecture and runtime smoke
        run: |
          file build/cognitive-os-agent
          ./build/cognitive-os-agent --version
          ./build/cognitive-os-agent-test --memory-v3-runtime
          ./build/cognitive-os-agent-test --flow
      - name: Create portable package
        run: |
          PACKAGE=cognitive-os-agent-linux-${{ matrix.arch }}
          mkdir -p "release/$PACKAGE"
          cp build/cognitive-os-agent README.md ../LICENSE ../NOTICE "release/$PACKAGE/"
          tar -C release -czf "$PACKAGE.tar.gz" "$PACKAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: backend/cognitive-os-agent-linux-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Set up Zig
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP\zig" -Force
          "$env:RUNNER_TEMP\zig\zig-x86_64-windows-0.14.1" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Create installer
        run: bash package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: backend/dist/cognitive-os-agent-setup.exe

  macos:
    name: macOS ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            source_arch: arm64
          - runner: macos-15-intel
            arch: x64
            source_arch: x86_64
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Create native app package
        run: bash package-macos.sh
      - name: Normalize archive name
        run: |
          mv dist/Cognitive-OS-macos-${{ matrix.source_arch }}.zip dist/cognitive-os-agent-macos-${{ matrix.arch }}.zip
          mv dist/Cognitive-OS-macos-${{ matrix.source_arch }}.pkg dist/cognitive-os-agent-macos-${{ matrix.arch }}.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            backend/dist/cognitive-os-agent-macos-${{ matrix.arch }}.zip
            backend/dist/cognitive-os-agent-macos-${{ matrix.arch }}.pkg

  publish:
    name: Publish GitHub Release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publish only after main CI for this exact release commit succeeds.
          SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          for attempt in $(seq 1 90); do
            RESULT=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --branch main --limit 1 --json status,conclusion --jq '.[0] | if .status == "completed" then .conclusion else "pending" end')
            if [ "$RESULT" = success ]; then break; fi
            if [ "$RESULT" != pending ] && [ -n "$RESULT" ] && [ "$RESULT" != null ]; then
              echo "Release blocked by CI: $RESULT"; exit 1
            fi
            sleep 30
          done
          test "$RESULT" = success
          NOTES="backend/docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$NOTES"
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$NOTES"
