name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Configure and build
        run: cmake -S . -B build-macos && cmake --build build-macos -j 3
      - name: Unit, scenario and benchmark tests
        run: ctest --test-dir build-macos --output-on-failure
      - name: Adapter and end-to-end tests
        run: |
          ./build-macos/mock-llm-server 9000 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          sleep 1
          ./build-macos/test-adapters
          ./build-macos/cognitive-os-agent-e2e
      - name: Package native desktop
        run: bash package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cognitive-os-${{ matrix.runner }}
          path: backend/dist/Cognitive-OS-macos-*.zip
  linux:
    name: Linux (gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make -j"$(nproc)"
      - name: Start mock LLM server (needed by adapters + e2e)
        run: |
          ./build/mock-llm-server 9000 &
          sleep 1
      - name: Unit tests
        run: ./build/cognitive-os-agent-test
      - name: Scenario tests
        run: ./build/cognitive-os-agent-scenario
      - name: Adapter tests (chat + SSE)
        run: ./build/test-adapters
      - name: Benchmark sanity (mock)
        run: ./build/cognitive-os-agent-bench --mock
      - name: E2E (mock LLM server)
        run: ./build/cognitive-os-agent-e2e

  linux-asan:
    name: Linux (AddressSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Build with ASAN
        run: make CFLAGS="-std=c11 -O1 -g -fsanitize=address -fno-omit-frame-pointer -Iinclude -Ithird_party/cJSON -Ithird_party/wasm3"
      - name: Unit tests under ASAN
        run: LD_PRELOAD=$(gcc -print-file-name=libasan.so) ASAN_OPTIONS=detect_leaks=0 ./build/cognitive-os-agent-test

  windows:
    name: Windows (zig cc)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Set up Zig (direct download — setup-zig mirrors are unreliable)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP\zig" -Force
          "$env:RUNNER_TEMP\zig\zig-x86_64-windows-0.14.1" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build
        run: ./build.sh
      - name: Unit tests
        run: ./build/cognitive-os-agent-test.exe
      - name: Scenario tests
        run: ./build/cognitive-os-agent-scenario.exe
      - name: Benchmark sanity (mock)
        run: ./build/cognitive-os-agent-bench.exe --mock
