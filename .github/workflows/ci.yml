name: CI

on:
  push:
    branches: [main]
  pull_request:

# Existing fixtures exercise the explicitly supported legacy text protocol.
env:
  COA_TOOL_PROTOCOL: legacy

jobs:
  macos:
    name: macOS (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Configure and build
        run: cmake -S . -B build-macos && cmake --build build-macos -j 3
      - name: Unit, scenario and benchmark tests
        run: ctest --test-dir build-macos --output-on-failure
      - name: Independent todo-cli acceptance verifier regression
        run: python3 tests/test_todo_cli_contract.py
      - name: Adapter and end-to-end tests
        run: |
          ./build-macos/mock-llm-server 9000 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          sleep 1
          ./build-macos/test-adapters
          ./build-macos/cognitive-os-agent-e2e
      - name: Actual process crash recovery
        run: COA_BUILD_DIR=build-macos python3 tests/test_crash_recovery_e2e.py
      - name: Visual provider timeout and recovery regression
        run: COA_BUILD_DIR=build-macos python3 tests/test_vision_wait_e2e.py
      - name: Native tool block continuation regression
        run: COA_BUILD_DIR=build-macos python3 tests/test_native_tool_loop.py
      - name: Information answer completion regression
        run: COA_BUILD_DIR=build-macos python3 tests/test_information_answers_e2e.py
      - name: Reciprocal group discussion regression
        run: COA_BUILD_DIR=build-macos python3 tests/test_im_discussion_e2e.py
      - name: Package native desktop
        run: bash package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cognitive-os-${{ matrix.runner }}
          path: backend/dist/Cognitive-OS-macos-*.zip
  linux:
    name: Linux (gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make -j"$(nproc)"
      - name: Start mock LLM server (needed by adapters + e2e)
        run: |
          ./build/mock-llm-server 9000 &
          sleep 1
      - name: Unit tests
        run: ./build/cognitive-os-agent-test
      - name: Planner duplicate-read recovery regression
        run: make build/cognitive-os-agent-test-plan-cycle && ./build/cognitive-os-agent-test-plan-cycle
      - name: Independent todo-cli acceptance verifier regression
        run: python3 tests/test_todo_cli_contract.py
      - name: Actual process crash recovery
        run: python3 tests/test_crash_recovery_e2e.py
      - name: Visual provider timeout and recovery regression
        run: python3 tests/test_vision_wait_e2e.py
      - name: Native tool block continuation regression
        run: python tests/test_native_tool_loop.py
      - name: Information answer completion regression
        run: python3 tests/test_information_answers_e2e.py
      - name: Reciprocal group discussion regression
        run: python3 tests/test_im_discussion_e2e.py
      - name: Scenario tests
        run: ./build/cognitive-os-agent-scenario
      - name: Adapter tests (chat + SSE)
        run: ./build/test-adapters
      - name: Benchmark sanity (mock)
        run: ./build/cognitive-os-agent-bench --mock
      - name: E2E (mock LLM server)
        run: ./build/cognitive-os-agent-e2e

  linux-asan:
    name: Linux (AddressSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Build with ASAN
        run: make CFLAGS="-std=c11 -O1 -g -fsanitize=address -fno-omit-frame-pointer -Iinclude -Ithird_party/cJSON -Ithird_party/wasm3"
      - name: Unit tests under ASAN
        run: LD_PRELOAD=$(gcc -print-file-name=libasan.so) ASAN_OPTIONS=detect_leaks=0 ./build/cognitive-os-agent-test
      - name: Native tool block continuation under ASAN
        run: ASAN_OPTIONS=detect_leaks=0 python3 tests/test_native_tool_loop.py

  windows:
    name: Windows (zig cc)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Set up Zig (direct download — setup-zig mirrors are unreliable)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP\zig" -Force
          "$env:RUNNER_TEMP\zig\zig-x86_64-windows-0.14.1" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build
        run: ./build.sh
      - name: Unit tests
        run: ./build/cognitive-os-agent-test.exe
      - name: Independent todo-cli acceptance verifier regression
        run: python tests/test_todo_cli_contract.py
      - name: Scenario tests
        run: ./build/cognitive-os-agent-scenario.exe
      - name: Benchmark sanity (mock)
        run: ./build/cognitive-os-agent-bench.exe --mock
      - name: SSH argument and private password regressions
        run: |
          ./build/cognitive-os-agent-test.exe --ssh-args
          ./build/cognitive-os-agent-test.exe --ssh-prompt
          ./build/cognitive-os-agent-test.exe --ssh-only
          python -m pip install paramiko
          python tests/test_ssh_password_e2e.py
      - name: Source read completion API regressions
        run: python tests/test_source_read_e2e.py
      - name: DSML tool-call execution regression
        run: python tests/test_dsml_e2e.py
      - name: Multi-agent dependency API regressions
        run: python tests/test_flow_dependencies_e2e.py
      - name: IM group member repair and validation
        run: python tests/test_im_members_e2e.py
      - name: Reciprocal group discussion regression
        run: python tests/test_im_discussion_e2e.py
      - name: Incomplete diagnostics and recovery API regression
        run: python tests/test_completion_recovery_e2e.py
      - name: Native tool block continuation regression
        run: python tests/test_native_tool_loop.py
      - name: Information answer completion regression
        run: python tests/test_information_answers_e2e.py
      - name: Visual provider timeout and recovery regression
        run: python tests/test_vision_wait_e2e.py
      - name: Complete browser MCP results API regression
        run: python tests/test_browser_results_e2e.py
      - name: Actual process crash recovery
        run: python tests/test_crash_recovery_e2e.py
      - name: Runtime benchmark smoke
        run: |
          python tests/test_runtime_benchmark.py
          python tests/test_runtime_reports.py
          python tests/test_live_demo_evidence.py
      - name: Skill discovery and execution API regressions
        run: python tests/test_skill_runtime_e2e.py
      - name: Recent status and file detail browser regressions
        run: |
          npm ci --prefix webarena --ignore-scripts --no-audit --no-fund
          NODE_PATH="$PWD/webarena/node_modules" node tests/test_issue_ui.cjs
          NODE_PATH="$PWD/webarena/node_modules" node tests/test_im_members_ui.cjs
          NODE_PATH="$PWD/webarena/node_modules" node tests/test_flow_resume_ui.cjs
          NODE_PATH="$PWD/webarena/node_modules" node tests/test_image_chat_ui.cjs
          NODE_PATH="$PWD/webarena/node_modules" node tests/test_plugin_install_ui.cjs
          python tests/test_image_preview.py
