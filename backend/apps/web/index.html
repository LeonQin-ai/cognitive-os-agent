<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>cognitive-os-agent — Cognitive OS Console</title>
<style>
  /* ---------- design tokens ---------- */
  :root{
    --radius:10px; --radius-sm:7px; --radius-xs:5px;
    --tr-dur:150ms;
    --mono:ui-monospace,"Cascadia Code",Consolas,"JetBrains Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei","PingFang SC",sans-serif;
    --side-w:232px;
  }
  /* base = dark theme */
  body{
    margin:0; font-family:var(--sans); font-size:13px; line-height:1.5;
    color-scheme:dark;
    background:#0b0e14; color:#e7ecf3;
    --bg:#0b0e14; --card:#141821; --border:#232a37;
    --fg:#e7ecf3; --muted:#8b94a7;
    --accent:#3b82f6; --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
    --sidebar:#080b10; --nav-hover:#11141b; --nav-on:#151b28; --input:#232b3a;
    --code-num:#c084fc;
    --accent-soft:color-mix(in srgb, var(--accent) 13%, transparent);
    --accent-ring:color-mix(in srgb, var(--accent) 42%, transparent);
    --card-hover:color-mix(in srgb, var(--fg) 4%, var(--card));
    --shadow:0 1px 2px rgba(0,0,0,.28), 0 12px 32px rgba(0,0,0,.24);
    --shadow-sm:0 1px 2px rgba(0,0,0,.2);
    display:flex; height:100vh; overflow:hidden;
  }
  body[data-theme=light]{
    color-scheme:light;
    background:#f3f5f9; color:#1b2233;
    --bg:#f3f5f9; --card:#ffffff; --border:#dfe4ee;
    --fg:#1b2233; --muted:#5b6478;
    --accent:#2563eb; --ok:#059669; --warn:#b45309; --danger:#dc2626;
    --sidebar:#e9edf4; --nav-hover:#dfe5ef; --nav-on:#ffffff; --input:#d3dbe8;
    --code-num:#7c3aed;
    --shadow:0 1px 3px rgba(23,34,58,.08), 0 12px 32px rgba(23,34,58,.12);
    --shadow-sm:0 1px 2px rgba(23,34,58,.06);
  }
  body[data-theme=ocean]{
    color-scheme:dark;
    background:#081120; color:#d8e9ff;
    --bg:#081120; --card:#0d1a2d; --border:#1c3350;
    --fg:#d8e9ff; --muted:#7fa3c9;
    --accent:#38bdf8; --ok:#34d399; --warn:#fbbf24; --danger:#fb7185;
    --sidebar:#060d18; --nav-hover:#0e2138; --nav-on:#113052; --input:#1c3350;
    --code-num:#a5b4fc;
  }
  body[data-theme=forest]{
    color-scheme:dark;
    background:#0c1310; color:#d9f2e4;
    --bg:#0c1310; --card:#132019; --border:#21372c;
    --fg:#d9f2e4; --muted:#8fb8a0;
    --accent:#34d399; --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
    --sidebar:#0a100c; --nav-hover:#15241c; --nav-on:#1a3a2a; --input:#21372c;
    --code-num:#86efac;
  }
  body[data-theme=sunset]{
    color-scheme:dark;
    background:#160f1a; color:#f1e3f0;
    --bg:#160f1a; --card:#221a26; --border:#392b41;
    --fg:#f1e3f0; --muted:#b19ab3;
    --accent:#e879f9; --ok:#4ade80; --warn:#fbbf24; --danger:#fb7185;
    --sidebar:#110c15; --nav-hover:#291e2e; --nav-on:#392b41; --input:#392b41;
    --code-num:#f0abfc;
  }

  *{box-sizing:border-box}
  ::selection{background:var(--accent-ring)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  aside{
    width:var(--side-w); flex-shrink:0; height:100vh;
    background:var(--sidebar); border-right:1px solid var(--border);
    display:flex; flex-direction:column; z-index:30; transition:transform var(--tr-dur) ease;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:16px 14px 14px; border-bottom:1px solid var(--border)}
  .logo{
    width:34px; height:34px; border-radius:9px; flex-shrink:0; display:grid; place-items:center;
    background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #000 0%));
    color:#fff; font-size:17px; font-weight:800; letter-spacing:-1px; user-select:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 6px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .brand h1{margin:0; font-size:15px; font-weight:700; letter-spacing:.2px}
  .brand .sub{color:var(--muted); font-size:11px; margin-top:1px}
  nav{flex:1; overflow-y:auto; padding:8px 0}
  nav button{
    display:flex; align-items:center; gap:10px; width:100%;
    background:none; border:0; border-left:3px solid transparent;
    color:var(--muted); padding:8px 13px; font-size:13px; cursor:pointer; text-align:left;
    transition:color var(--tr-dur), background var(--tr-dur);
  }
  nav button svg{flex-shrink:0; opacity:.9}
  nav button:hover{background:var(--nav-hover); color:var(--fg)}
  nav button:focus-visible{outline:2px solid var(--accent-ring); outline-offset:-2px}
  nav button.on, nav button[aria-current="true"]{
    background:var(--nav-on); border-left-color:var(--accent); color:var(--fg); font-weight:600;
  }
  .side-foot{padding:12px 14px; border-top:1px solid var(--border)}
  .conn{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted)}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0}
  .dot.ok{background:var(--ok)}
  .dot.warn{background:var(--warn)}
  .dot.err{background:var(--danger)}
  .dot.pulse{animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

  main{flex:1; display:flex; flex-direction:column; min-width:0; height:100vh}
  .top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 18px; border-bottom:1px solid var(--border); background:var(--card); flex-shrink:0;
  }
  .top-left{display:flex; align-items:center; gap:10px; min-width:0}
  .title{font-size:14px; font-weight:650; letter-spacing:.2px; outline:none}
  .flow{color:var(--muted); font-size:11px; letter-spacing:.45px; white-space:nowrap; user-select:none}
  .topright{display:flex; align-items:center; gap:10px}
  .icon-btn{
    width:32px; height:32px; display:grid; place-items:center;
    background:none; border:1px solid transparent; border-radius:var(--radius-sm);
    color:var(--muted); cursor:pointer; padding:0;
    transition:color var(--tr-dur), background var(--tr-dur), border-color var(--tr-dur);
  }
  .icon-btn:hover{color:var(--fg); background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 30%, transparent)}
  .icon-btn:focus-visible{outline:2px solid var(--accent-ring); outline-offset:2px}
  #navToggle{display:none}
  .content{flex:1; padding:20px; overflow-y:auto; scrollbar-gutter:stable}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow-sm)}
  .card h2{margin:0 0 4px; font-size:13px; font-weight:650}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px}
  .card-head h2{margin:0}
  .card-head .row{margin:0; gap:6px}
  .hint{color:var(--muted); font-size:12px; margin:0 0 10px; line-height:1.65}
  .muted{color:var(--muted)}

  textarea,input[type=text],input[type=number],select{
    width:100%; background:var(--bg); color:var(--fg);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:8px 10px; font-size:12.5px;
    transition:border-color var(--tr-dur), box-shadow var(--tr-dur);
  }
  textarea,input[type=text],input[type=number]{font-family:var(--mono)}
  textarea:focus,input[type=text]:focus,input[type=number]:focus,select:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring);
  }
  textarea{height:76px; resize:vertical; line-height:1.55}
  select{height:34px; width:auto; min-width:96px; cursor:pointer; font-family:var(--sans); font-size:12.5px; padding:0 26px 0 10px}
  ::placeholder{color:var(--muted); opacity:.75}

  button{
    background:var(--accent); color:#fff; border:0; border-radius:var(--radius-sm);
    padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
    transition:filter var(--tr-dur), transform var(--tr-dur), background var(--tr-dur), border-color var(--tr-dur), color var(--tr-dur);
  }
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent-ring); outline-offset:2px}
  button:disabled{opacity:.5; cursor:not-allowed; filter:none; transform:none}
  button.sec{background:var(--card); border:1px solid var(--border); color:var(--fg)}
  button.sec:hover{background:var(--card-hover)}
  button.danger{background:transparent; color:var(--danger); border:1px solid var(--danger)}
  button.danger:hover{background:color-mix(in srgb, var(--danger) 12%, transparent)}
  button.sm{padding:4px 9px; font-size:11.5px; font-weight:600}
  a.tag{display:inline-block; font-size:10px; font-weight:700; color:var(--accent);
       border:1px solid var(--accent); border-radius:8px; padding:0 6px; margin-left:6px; text-decoration:none; vertical-align:1px}
  a.tag:hover{background:color-mix(in srgb, var(--accent) 14%, transparent)}
  .item b a{color:var(--fg); text-decoration:none}
  .item b a:hover{color:var(--accent)}
  .row{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap}

  pre{
    background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px; font-size:12px; line-height:1.55; margin:0;
    overflow:auto; white-space:pre-wrap; word-break:break-word;
    max-height:55vh; min-height:56px; font-family:var(--mono);
  }
  .json .k{color:var(--accent); font-weight:600}
  .json .s{color:var(--ok)}
  .json .b{color:var(--warn)}
  .json .num{color:var(--code-num)}
  .json .n{color:var(--danger)}
  .json .p{color:var(--muted)}
  .json .empty{color:var(--muted); font-style:italic}

  .table-wrap{overflow:auto; border:1px solid var(--border); border-radius:var(--radius-sm); margin-top:8px}
  table{width:100%; border-collapse:collapse; font-size:12.5px}
  thead th{position:sticky; top:0; z-index:1; background:var(--card); text-align:left; padding:9px 12px; border-bottom:1px solid var(--border); color:var(--muted); font-weight:600; white-space:nowrap}
  td{padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:top}
  tbody tr{transition:background var(--tr-dur)}
  tbody tr:hover{background:var(--card-hover)}
  tr.active-row td{background:var(--accent-soft)}
  tr.active-row td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

  .badge{display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap}
  .badge-ok{background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok)}
  .badge-warn{background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn)}
  .badge-err{background:color-mix(in srgb, var(--danger) 16%, transparent); color:var(--danger)}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{
    display:inline-flex; align-items:center; gap:6px; max-width:100%;
    padding:4px 10px; background:var(--bg); border:1px solid var(--border);
    border-radius:999px; font-size:12px; cursor:pointer; color:var(--fg);
    transition:border-color var(--tr-dur), color var(--tr-dur);
  }
  .chip b{color:var(--muted); font-weight:700; flex-shrink:0}
  .chip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chip:hover{border-color:var(--accent); color:var(--accent)}

  .toast{position:fixed; bottom:24px; left:50%; transform:translate(-50%, 12px); background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:12.5px; font-weight:600; opacity:0; pointer-events:none; z-index:99; box-shadow:var(--shadow); transition:opacity var(--tr-dur), transform var(--tr-dur)}
  .toast.show{opacity:1; transform:translate(-50%, 0)}
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:none; backdrop-filter:blur(2px)}

  /* ---------- dashboard stats ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
  .stat{padding:14px 16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--card)}
  .stat .num{font-size:22px; font-weight:700}
  .stat .lbl{font-size:11.5px; color:var(--muted); margin-top:2px}

  /* ---------- IM ---------- */
  .im-layout{display:grid; grid-template-columns:250px 1fr; gap:14px; align-items:start}
  .im-sessions{display:flex; flex-direction:column; gap:6px; max-height:calc(100vh - 260px); overflow-y:auto; padding-right:2px}
  .im-session{padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px; background:var(--bg); transition:all var(--tr-dur); display:flex; justify-content:space-between; align-items:center; gap:6px}
  .im-session:hover{border-color:var(--accent)}
  .im-session.on{background:var(--accent-soft); border-color:var(--accent)}
  .im-session .del{color:var(--muted); background:none; border:0; padding:0 2px; font-size:12px; cursor:pointer}
  .im-session .del:hover{color:var(--danger)}
  .im-session .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .im-thread{display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 340px); min-height:180px; overflow-y:auto; padding:4px}
  .im-msg{max-width:80%; padding:9px 12px; border-radius:12px; font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word}
  .im-msg.user{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:3px}
  .im-msg.assistant{align-self:flex-start; background:var(--bg); border:1px solid var(--border); border-bottom-left-radius:3px}
  .im-msg .meta{font-size:10.5px; opacity:.75; margin-top:3px}
  .im-input-row{display:flex; gap:8px; margin-top:10px}
  .im-input-row input{flex:1}
  @media (max-width:760px){.im-layout{grid-template-columns:1fr}}

  .spin{display:inline-block; width:12px; height:12px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:rot .8s linear infinite; vertical-align:-2px}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ---------- plaza (MCP 广场 / 免费模型广场) ---------- */
  .plaza{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px}
  .plaza .item{border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; background:var(--bg)}
  .plaza .item h3{margin:0 0 4px; font-size:13px; font-weight:650}
  .plaza .item p{margin:0 0 8px; font-size:12px; color:var(--muted); min-height:30px; line-height:1.5}
  .plaza .item .url{font-family:var(--mono); font-size:11px; color:var(--muted); word-break:break-all; margin-bottom:8px}
  .plaza .item .hint{font-size:11px; color:var(--warn); margin-bottom:8px; line-height:1.5}
  .plaza .item .row{margin:0}

  @media (max-width:899px){
    #navToggle{display:grid}
    aside{position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%)}
    aside.open{transform:translateX(0); box-shadow:var(--shadow)}
    .backdrop.on{display:block}
    .flow{display:none}
  }
  @media (max-width:600px){
    .content{padding:14px}
    .card{padding:14px}
    .top{padding:10px 12px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important}
  }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">
    <div class="logo" aria-hidden="true">c</div>
    <div>
      <h1>cognitive-os-agent</h1>
      <div class="sub">Cognitive OS Runtime</div>
    </div>
  </div>
  <nav id="nav" aria-label="控制台分区">
    <button data-p="dashboard" class="on" aria-current="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </button>
    <button data-p="chat">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      对话
    </button>
    <button data-p="agents">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Agents
    </button>
    <button data-p="policy">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      策略
    </button>
    <button data-p="flow">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h6a3 3 0 0 1 3 3v6"/></svg>
      Flow
    </button>
    <button data-p="models">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>
      Models
    </button>
    <button data-p="mcp">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      MCP
    </button>
    <button data-p="skills">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      Skills
    </button>
    <button data-p="plugins">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a7 7 0 1 1-7-7"/><path d="M21 4v5h-5"/></svg>
      Plugins
    </button>
    <button data-p="im">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      IM
    </button>
    <button data-p="memory">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
      Memory
    </button>
    <button data-p="snapshots">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Execution

'use strict';
const $ = id => document.getElementById(id);

/* ================= 基础工具 ================= */

async function call(method, path, body) {
  try {
    const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
    const text = await r.text();
    let obj; try { obj = JSON.parse(text); } catch { obj = {raw: text}; }
    return {status: r.status, obj, text};
  } catch (e) {
    return {status: 0, obj: {error: String(e)}, text: ''};
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderPre(obj){ return jsonHighlight(obj); }

function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(() => toast('已复制'), () => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch(e) { toast('复制失败'); }
  ta.remove();
}
function copyPre(id){ const el = $(id); if(el) copyText(el.textContent); }

/* ================= JSON 语法高亮 ================= */

const JSON_RX = /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;

function jsonHighlight(obj){
  const s = JSON.stringify(obj, null, 2);
  let out = '', last = 0, m;
  JSON_RX.lastIndex = 0;
  while ((m = JSON_RX.exec(s))) {
    out += esc(s.slice(last, m.index));
    const tok = m[0];
    if (/:$/.test(tok)) {
      out += '<span class="k">' + esc(tok.slice(0, -1)) + '</span><span class="p">:</span>';
    } else if (tok[0] === '"') {
      out += '<span class="s">' + esc(tok) + '</span>';
    } else if (tok === 'true' || tok === 'false') {
      out += '<span class="b">' + tok + '</span>';
    } else if (tok === 'null') {
      out += '<span class="n">null</span>';
    } else {
      out += '<span class="num">' + tok + '</span>';
    }
    last = JSON_RX.lastIndex;
  }
  out += esc(s.slice(last));
  return '<div class="json">' + out + '</div>';
}

function renderJSON(obj, el){
  if(!el) return;
  const empty = obj == null ||
    (Array.isArray(obj) && !obj.length) ||
    (typeof obj === 'object' && !Array.isArray(obj) && !Object.keys(obj).length);
  el.innerHTML = empty
    ? '<div class="json"><span class="empty">（暂无数据）</span></div>'
    : jsonHighlight(obj);
}

function outPanel(title, outId, pname){
  return '<div class="card"><div class="card-head"><h2>' + esc(title) + '</h2>' +
    '<div class="row"><button class="sec sm" onclick="load(\'' + pname + '\')">Refresh</button>' +
    '<button class="sec sm" onclick="copyPre(\'' + outId + '\')">Copy</button></div></div>' +

}

/* ================= 数据加载 ================= */

async function load(panel){
  if(panel === 'models') return loadModels();
  if(panel === 'dashboard') return loadDashboard();
  if(panel === 'im') return renderIm();
  if(panel === 'agents') return loadAgents();
  if(panel === 'mcp') return loadMcp();
  if(panel === 'skills') return (loadSkillsMarket(), loadSkillsCatalog());
  if(panel === 'plugins') return loadPluginMarket();
  if(panel === 'snapshots') return loadSnapshots();
  if(panel === 'chat') return loadChat();
  if(panel === 'policy') return loadPolicy();
  if(panel === 'flow') return loadFlow();
  if(panel === 'metrics'){
    const r = await call('GET', '/metrics');
    const el = $('metrics-out'); if(el) el.textContent = r.text;
    return;
  }
  const f = fetchers[panel];
  if(!f) return;
  const r = await call('GET', f.path);
  const el = $(f.out); if(el) renderJSON(r.obj, el);
}

/* ================= Snapshots ================= */

async function loadSnapshots(){
  const r = await call('GET', '/v1/snapshots');
  const el = $('snapshots-out'); if(el) renderJSON(r.obj, el);
  await loadSnapshotCfg();
}

async function loadSnapshotCfg(){
  const r = await call('GET', '/v1/config/snapshot');
  const el = $('snap-max'); if(!el) return;
  const v = (r.obj && typeof r.obj.max_file === 'number' && r.obj.max_file >= 0) ? r.obj.max_file : 67108864;
  el.value = v === 0 ? 0 : Math.round(v / 1048576);
  const st = $('snap-max-msg'); if(st) st.textContent = '';
}

async function saveSnapshotCfg(){
  const el = $('snap-max'); if(!el) return;
  const st = $('snap-max-msg');
  const mb = parseInt(el.value, 10);
  if(isNaN(mb) || mb < 0){ if(st) st.textContent = '请输入 ≥ 0 的整数（0 = 不限制）'; return; }
  const r = await call('POST', '/v1/config/snapshot', {max_file: mb * 1048576});
  if(st) st.textContent = (r.status === 200 && r.obj && r.obj.ok) ? '已保存' : ('失败: ' + (r.text || ('HTTP ' + r.status)).slice(0, 80));
}

async function loadMcpPlaza(){
  const box = $('mcp-plaza');
  if(!box) return;

  if(!MCP_PLAZA.length){ box.innerHTML = '<span class="muted" style="font-size:12px">（目录为空）</span>'; return; }
  box.innerHTML = MCP_PLAZA.map((m, i) => {
    const isRef = m.transport === 'reference';
    const target = isRef ? esc(m.repo || '')
      : esc(m.transport === 'stdio' ? ((m.command || '') + ' ' + (m.args || '')) : (m.url || ''));
    let btns = '';
    if(isRef){
      btns = '<a class="sec sm" href="' + esc(m.repo) + '" target="_blank" rel="noopener">查看仓库</a>';
    } else {
      btns = '<button class="sec sm" onclick="mcpPlazaTest(' + i + ')">测试</button> ' +
             '<button class="sec sm" onclick="mcpPlazaUse(' + i + ')">添加连接</button>';
    }
    return '<div class="item"><h3>' + esc(m.name) + (m.repo ? ' <a class="tag" href="' + esc(m.repo) + '" target="_blank" rel="noopener">GitHub</a>' : '') + (isRef ? ' <span class="tag">参考仓库</span>' : '') + '</h3><p>' + esc(m.description) + '</p>' +
      '<div class="url">' + target + '</div>' +
      '<div class="hint">' + (isRef ? '' : (m.needs_local ? '需本地运行 · ' : '')) + esc(m.key_hint || '') + '</div>' +
      btns + '</div>';
  }).join('');
}

async function mcpPlazaTest(i){
  const m = MCP_PLAZA[i]; if(!m) return;
  if(m.transport === 'reference'){ toast('参考仓库条目无需测试，请到仓库查看'); return; }
  toast('测试 MCP 连接 ' + m.id + ' …');
  const body = {transport: m.transport || 'http'};
  if(body.transport === 'stdio'){ body.command = m.command || ''; body.args = m.args || ''; }
  else body.url = m.url;
  if(m.needs_token && !body.token){
    const tok = prompt('该 MCP 服务器需要凭据，请输入 ' + (m.key_hint || 'token') + '（留空则不带 token 测试）：');
    if(tok && tok.trim()) body.token = tok.trim();
  }
  const r = await call('POST', '/v1/mcp/test', body);
  if(r.obj && r.obj.ok) toast('✔ 连接成功：' + (r.obj.count || 0) + ' 个工具');
  else toast('✘ 测试失败: ' + ((r.obj && r.obj.error) || ('HTTP ' + r.status)));
}

async function mcpPlazaUse(i){
  const m = MCP_PLAZA[i]; if(!m) return;
  toast('添加 MCP 连接 ' + m.id + ' …');
  const body = {name: m.id, transport: m.transport || 'http'};
  if(m.transport === 'stdio'){
    body.command = m.command || '';
    body.args = m.args || '';
    if(!body.command){ toast('该条目缺少 stdio 命令'); return; }
  } else {
    body.url = m.url;
  }
  if(m.token && m.token_hint) body.token = m.token;
  if(m.needs_token && !body.token){
    const tok = prompt('该 MCP 服务器需要凭据，请输入 ' + (m.key_hint || 'token') + '：');
    if(!tok){ toast('已取消（未填 token）'); return; }
    body.token = tok.trim();
    if(!body.token){ toast('已取消（未填 token）'); return; }
  }
  const r = await call('POST', '/v1/mcp', body);
  if(r.status < 300) toast('✔ 已添加连接 ' + m.id);
  else toast('添加失败: ' + ((r.obj && r.obj.error) || ('HTTP ' + r.status)));
  loadMcp();
}

function mcpAdd(){
  const name = $('mcp-name').value.trim();
  const transport = $('mcp-transport') ? $('mcp-transport').value : 'http';
  const url = $('mcp-url').value.trim();
  const command = $('mcp-command') ? $('mcp-command').value.trim() : '';
  const args = $('mcp-args') ? $('mcp-args').value.trim() : '';
  const token = $('mcp-token').value.trim();
  const st = $('mcp-stat');
  if(!name){ if(st) st.textContent = '需要 name'; return; }
  if(transport === 'http' && !url){ if(st) st.textContent = 'http 传输需要 url'; return; }
  if(transport === 'stdio' && !command){ if(st) st.textContent = 'stdio 传输需要 command'; return; }
  const body = {name, transport};
  if(transport === 'http') body.url = url; else { body.command = command; if(args) body.args = args; }
  if(token) body.token = token;
  call('POST', '/v1/mcp', body).then(r => {
    if(st) st.textContent = (r.status < 300) ? '✔ 已添加' : ((r.obj && r.obj.error) ? 'error: ' + r.obj.error : 'error ' + r.status);
    if(r.status < 300){ $('mcp-name').value = ''; $('mcp-url').value = ''; $('mcp-command').value = ''; $('mcp-args').value = ''; $('mcp-token').value = ''; loadMcp(); }
  });
}

async function mcpConnTest(i){
  const c = MCP_CONNS[i]; if(!c) return;
  toast('测试 MCP 连接 ' + c.name + ' …');
  const body = {transport: c.transport || 'http'};
  if(body.transport === 'stdio'){ body.command = c.command || ''; body.args = c.args || ''; }
  else body.url = c.url;
  const r = await call('POST', '/v1/mcp/test', body);
  if(r.obj && r.obj.ok) toast('✔ ' + c.name + ' 连接成功：' + (r.obj.count || 0) + ' 个工具');
  else toast('✘ ' + c.name + ' 测试失败: ' + ((r.obj && r.obj.error) || ('HTTP ' + r.status)));
}

async function mcpSync(){
  toast('重新发现 MCP 工具…');
  const r = await call('POST', '/v1/mcp/sync', {});
  if(r.status < 300) toast('✔ 已重新发现 ' + ((r.obj && r.obj.registered) || 0) + ' 个工具');

function mcpDelete(i){

let IM_ACTIVE = null;
let WS = null;
let IM_CHANNELS = [];

function imCreate(){
  const name = $('im-new').value.trim() || '新会话';

}

async function loadChannels(){

async function renderChannels(){
  await loadChannels();

  if(!box) return;

function imSelect(id){
  IM_ACTIVE = id;
  document.querySelectorAll('.im-session').forEach(s => s.classList.toggle('on', s.dataset.id === String(id)));
  renderImThread();
}

function appendImMessage(m){
  const t = $('im-thread');
  if(!t) return;
  const d = new Date(m.ts_ms || Date.now());
  const time = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  const isMine = (m.role === 'user') && (!m.sender || m.sender === 'me');
  const div = document.createElement('div');
  div.className = 'im-msg ' + (isMine ? 'user' : 'assistant');
  div.textContent = m.content || '';
  const meta = document.createElement('div');
  meta.className = 'meta';
  const who = m.sender || (m.role === 'user' ? 'user' : 'assistant');
  meta.textContent = who + ' · ' + time;
  div.appendChild(meta);
  t.appendChild(div);
  t.scrollTop = t.scrollHeight;
}

async function renderImThread(){
  const t = $('im-thread');
  if(!t) return;
  if(IM_ACTIVE === null){
    t.innerHTML = '<span class="muted" style="font-size:12px">选择一个会话开始聊天</span>';
    return;
  }
  t.innerHTML = '<span class="muted"><span class="spin"></span> 加载中…</span>';
  const r = await call('GET', '/v1/im/sessions/' + IM_ACTIVE + '/messages');
  t.innerHTML = '';
  if(Array.isArray(r.obj)){
    r.obj.forEach(m => appendImMessage(m));
  }
}

async function renderIm(){
  const list = $('im-sessions');
  if(!list) return;
  await loadChannels();
  const sel = $('im-channel');
  if(sel){
    sel.innerHTML = '<option value="">无关联渠道</option>';
    IM_CHANNELS.forEach(c => {
      const o = document.createElement('option'); o.value = c.name; o.textContent = c.name + ' (' + c.type + ')';
      sel.appendChild(o);
    });
  }
  const g = $('im-group');
  if(g && !g.dataset.bound){
    g.dataset.bound = '1';
    g.addEventListener('change', () => { const el = $('im-members'); if(el) el.hidden = !g.checked; });
  }
  const r = await call('GET', '/v1/im/sessions');
  const sessions = (r.obj && Array.isArray(r.obj.sessions)) ? r.obj.sessions : [];
  list.innerHTML = '';
  if(!sessions.length){
    list.innerHTML = '<span class="muted" style="font-size:12px">暂无会话，创建第一个吧</span>';
    return;
  }
  sessions.forEach(s => {
    const isGroup = s.kind === 'group';
    const div = document.createElement('div');
    div.className = 'im-session' + (s.id === IM_ACTIVE ? ' on' : '');
    div.dataset.id = s.id;
    div.onclick = () => imSelect(s.id);
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = (s.name || ('#' + s.id)) + ' · ' + (s.messages || 0);
    if(isGroup) name.textContent += ' · ' + ((s.members || []).length) + '人';
    const badge = document.createElement('span');
    badge.className = 'badge ' + (isGroup ? 'badge-ok' : 'badge-warn');
    badge.textContent = isGroup ? '群' : '单';
    if(s.channel){
      const ch = document.createElement('span');
      ch.className = 'badge badge-accent';
      ch.textContent = '渠道:' + s.channel;
      ch.title = '关联外部渠道';
      name.appendChild(ch);
    }
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '删除会话';
    del.onclick = (e) => { e.stopPropagation(); imDelete(s.id); };
    const left = document.createElement('span');
    left.style.cssText = 'display:flex;align-items:center;gap:6px;min-width:0;flex:1';
    left.appendChild(badge);
    left.appendChild(name);
    div.appendChild(left);
    div.appendChild(del);
    list.appendChild(div);
  });
  renderChannels();
  renderImThread();
}

function imSend(){
  const input = $('im-input');
  let content = input.value.trim();
  if(!content || IM_ACTIVE === null) return;
  let sender = 'me';
  const m = content.match(/^@(\S+)\s+/);
  if(m){ sender = m[1]; content = content.slice(m[0].length); }
  if(!content) return;
  input.value = '';
  const payload = {type:'im.send', session_id: IM_ACTIVE, content, sender};
  if(WS && WS.readyState === WebSocket.OPEN){
    WS.send(JSON.stringify(payload));
  } else {
    call('POST', '/v1/im/sessions/' + IM_ACTIVE + '/messages', {role:'user', content, sender}).then(r => {
      if(r.obj && r.obj.ok) renderImThread();
    });
  }
}

async function imSearch(){
  const q = $('im-search').value.trim();
  const box = $('im-search-results');
  if(!q){ if(box) box.innerHTML = ''; return; }
  const r = await call('GET', '/v1/im/search?q=' + encodeURIComponent(q));
  const hits = Array.isArray(r.obj) ? r.obj : [];
  if(!box) return;
  if(!hits.length){
    box.innerHTML = '<div class="muted" style="font-size:12px;margin:0 0 8px">无匹配</div>';
    return;
  }
  box.innerHTML = '<div class="chips" style="margin-bottom:8px">' + hits.map(h =>
    '<button class="chip" onclick="imSelect(' + h.session_id + ')" title="' + esc(h.content) + '">' +
    '<b>' + esc(h.session_name || ('#' + h.session_id)) + '</b><span>' + esc(h.content) + '</span></button>'
  ).join('') + '</div>';
}

/* ================= WebSocket 实时推送 ================= */

function wsConnect(){
  try {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    WS = new WebSocket(proto + '://' + location.host + '/ws');
    WS.onmessage = (e) => {
      try {
        const m = JSON.parse(e.data);
        if(m.type === 'im.message'){
          if(current === 'im' && IM_ACTIVE === m.session_id){
            appendImMessage(m);
          } else {
            toast('📩 新消息: ' + ((m.role === 'user') ? '用户' : '助手'));
          }
        } else if(m.type === 'event' && m.source === 'flow'){
          const el = $('flow-out');
          if(el && m.payload){
            const p = m.payload;
            let line = '';
            if(p.stage === 'execute') line = '→ [' + (p.node || '') + ':' + (p.agent || '') + '] ' + (p.detail || '');
            else if(p.stage === 'done') line = '✓ [' + (p.node || '') + ':' + (p.agent || '') + '] ' + (p.detail || '完成');
            if(line) el.textContent += (el.textContent ? '\n' : '') + line;
          }
        } else if(m.type === 'event' && CHAT_BUSY){
          const st = $('chat-status');
          if(st && m.payload){
            if(m.payload.plan) st.textContent = '第 ' + (CHAT_ROUND = (CHAT_ROUND||0) + 1) + ' 轮：规划中…';
            else if(m.payload.result) st.textContent = '第 ' + (CHAT_ROUND||1) + ' 轮：动作结果已回传';
          }
        }
      } catch(err) { /* ignore non-JSON */ }
    };
    WS.onclose = () => { setTimeout(wsConnect, 3000); };
    WS.onerror = () => { try { WS.close(); } catch(e) {} };
  } catch(e) { /* ws unsupported */ }
}

function chatAddBubble(role, text){
  const box = $('chat-box'); if(!box) return;
  const wrap = document.createElement('div');
  wrap.style.cssText = role === 'user'
    ? 'align-self:flex-end;max-width:85%;background:var(--accent,#3b82f6);color:#fff;border-radius:12px 12px 2px 12px;padding:8px 12px;white-space:pre-wrap;word-break:break-word'
    : 'align-self:flex-start;max-width:92%;background:var(--card2,#1f2430);border:1px solid var(--border,#333);border-radius:12px 12px 12px 2px;padding:8px 12px';
  if(role === 'bot'){
    const pre = document.createElement('pre');
    pre.style.cssText = 'margin:0;white-space:pre-wrap;word-break:break-word;font-size:12.5px';
    pre.textContent = text;
    wrap.appendChild(pre);
  } else {
    wrap.textContent = text;
  }
  box.appendChild(wrap);
  chatScroll();
  return wrap;
}

function chatScroll(){
  const box = $('chat-box');
  if(box) box.scrollTop = box.scrollHeight;
}

let CHAT_BUSY = false;
let CHAT_ROUND = 0;

async function chatSend(){
  if(CHAT_BUSY) return;
  const input = $('chat-input');
  const msg = input ? input.value.trim() : '';
  if(!msg) return;
  const st = $('chat-status');
  CHAT_BUSY = true;
  CHAT_ROUND = 0;
  input.value = '';
  chatAddBubble('user', msg);
  const bot = chatAddBubble('bot', '…');
  const c = await call('POST', '/v1/chat', {message: msg});
  const id = c.obj && c.obj.id;
  if(id === undefined){
    bot.querySelector('pre').textContent = '提交失败: ' + (c.text || ('HTTP ' + c.status));
    CHAT_BUSY = false;
    return;
  }
  for(let i = 0; i < 600; i++){
    const r = await call('GET', '/v1/tasks/' + id);
    const t = r.obj;
    if(st) st.textContent = (t && t.status && t.status !== 'DONE') ? ('状态: ' + t.status) : '';
    if(t && (t.status === 'DONE' || t.status === 'FAILED' || t.status === 'CANCELLED' || t.status === 'TIMEOUT')){
      bot.querySelector('pre').textContent = (t.output && t.output.trim()) ? t.output : ('(' + t.status + '，无输出)');
      if(st) st.textContent = '';
      CHAT_BUSY = false;
      chatScroll();
      return;
    }
    await new Promise(res => setTimeout(res, 300));
  }
  bot.querySelector('pre').textContent = '(等待超时，任务仍在后台执行；可在 Tasks 页查看)';
  CHAT_BUSY = false;
}

async function uploadFile(inp){
  const f = inp.files && inp.files[0];
  if(!f) return;
  const st = $('chat-status');
  if(st) st.textContent = '上传中: ' + f.name + '…';
  try {
    const resp = await fetch('/v1/upload?name=' + encodeURIComponent(f.name), {method:'POST', body: f});
    const obj = await resp.json().catch(() => ({}));
    if(resp.ok && obj.ok) toast('已上传 ' + obj.name + (obj.chunks ? ('（' + obj.chunks + ' 块入库）') : ''));
    else toast('上传失败: ' + (obj.error || ('HTTP ' + resp.status)));
  } catch(e) { toast('上传失败: ' + e); }
  inp.value = '';
  if(st) st.textContent = '';
  loadUploads();
}

async function loadUploads(){

  const r = await call('GET', '/v1/uploads');
  const files = (r.obj && Array.isArray(r.obj.files)) ? r.obj.files : [];

    ? files.map(f => '<span class="chip">' + esc(f.name) + ' <span class="muted">(' + (f.size/1024).toFixed(1) + ' KB)</span> <button class="sec sm" onclick="delUpload(\'' + esc(f.name).replace(/'/g,"\\'") + '\')">✕</button></span>').join('')

async function delUpload(name){

let FLOW_BUSY = false;

/* 生成 DAG：LLM 分解总任务 → 填入下方编辑器（不执行，可修改） */
async function flowGen(){
  const input = $('flow-task'), st = $('flow-gen-status'), ta = $('flow-json');
  if(!input || !st) return;
  const task = input.value.trim();
  if(!task){ st.textContent = '请先输入总任务'; return; }
  st.textContent = '分解中…';
  const c = await call('POST', '/v1/flows/decompose', {task});
  if(c.status === 200 && c.obj && c.obj.dag){
    if(ta) ta.value = JSON.stringify(c.obj.dag, null, 2);
    st.textContent = '已生成，可在下方修改后执行';
  } else {
    st.textContent = '生成失败: ' + ((c.obj && c.obj.error) || c.text || ('HTTP ' + c.status));
  }
}

/* 自动执行：分解→执行→综合答案一步完成 */
async function flowAuto(){
  if(FLOW_BUSY) return;
  const input = $('flow-task'), st = $('flow-gen-status'), out = $('flow-out');
  if(!input) return;
  const task = input.value.trim();
  if(!task){ if(st) st.textContent = '请先输入总任务'; return; }
  FLOW_BUSY = true;
  if(st) st.textContent = '已提交（分解→执行→综合）…';
  if(out) out.textContent = '';
  const c = await call('POST', '/v1/orchestrate', {task});
  const id = c.obj && c.obj.id;
  if(id === undefined){
    if(st) st.textContent = '提交失败: ' + (c.text || ('HTTP ' + c.status));
    FLOW_BUSY = false;
    return;
  }
  for(let i = 0; i < 600; i++){
    const r = await call('GET', '/v1/tasks/' + id);
    const t = r.obj;
    if(st && t && t.status && t.status !== 'DONE') st.textContent = '状态: ' + t.status;
    if(t && (t.status === 'DONE' || t.status === 'FAILED' || t.status === 'CANCELLED' || t.status === 'TIMEOUT')){
      FLOW_LAST_OUTPUT = t.output || '';
      if(out) out.textContent = FLOW_LAST_OUTPUT ? ('—— 综合答案 ——\n' + FLOW_LAST_OUTPUT) : '(无输出)';
      if(st) st.textContent = '';
      FLOW_BUSY = false;
      loadFlow();
      return;
    }
    await new Promise(res => setTimeout(res, 300));
  }
  if(st) st.textContent = '(等待超时，任务仍在后台执行)';
  FLOW_BUSY = false;
}

let POLICY_TOOLS_LOADED = false;
async function loadPolicyTools(){
  const sel = $('pol-tool'); if(!sel) return;
  if(POLICY_TOOLS_LOADED) return;
  const r = await call('GET', '/v1/tools');
  const tools = Array.isArray(r.obj) ? r.obj : [];
  if(!tools.length) return;
  const cur = sel.value || '*';
  sel.innerHTML = '<option value="*">*</option>' +
    tools.map(t => '<option value="' + esc(t.name) + '">' + esc(t.name) + '</option>').join('');
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : '*';
  POLICY_TOOLS_LOADED = true;
}

async function loadPolicy(){
  const el = $('pol-list'); if(!el) return;
  loadPolicyTools();
  const r = await call('GET', '/v1/policy/rules');
  const rules = (r.obj && r.obj.rules) ? r.obj.rules : [];
  if(!rules.length){
    el.innerHTML = '<span class="muted" style="font-size:12px">暂无规则（默认全放行）</span>';
    return;
  }
  const parts = [];
  for(const g of rules){
    const deny = g.action === 'deny';
    const color = deny ? '#e74c3c' : (g.action === 'ask' ? '#f39c12' : '#27ae60');
    parts.push('<div style="display:flex;align-items:center;gap:8px;margin:6px 0">' +
      '<span style="font-family:monospace;color:' + color + ';font-weight:600">' + esc(g.action) + '</span>' +
      '<span style="font-family:monospace">' + esc(g.tool) + '</span>' +
      (g.reason ? '<span class="muted" style="font-size:12px">' + esc(g.reason) + '</span>' : '') +
      '<span style="flex:1"></span>' +
      '<button class="sec sm" onclick="policyDelete(' + g.index + ')">删除</button>' +
      '</div>');
  }
  el.innerHTML = parts.join('');
}

async function policyAdd(){
  const tool = $('pol-tool'), act = $('pol-action'), reason = $('pol-reason'), st = $('pol-stat');
  if(!tool || !act) return;
  const t = tool.value.trim();
  if(!t){ if(st) st.textContent = 'tool 名不能为空'; return; }
  const c = await call('POST', '/v1/policy/rules',
    {tool: t, action: act.value, reason: reason ? reason.value.trim() : ''});
  if(c.status === 200){
    if(st) st.textContent = '已添加' + (c.obj && c.obj.saved ? '并持久化' : '（持久化失败，重启会丢失）');
    tool.value = '*'; if(reason) reason.value = '';
    loadPolicy();
  } else {
    if(st) st.textContent = '添加失败: ' + (c.text || ('HTTP ' + c.status));
  }
}

async function policyDelete(idx){
  const c = await call('DELETE', '/v1/policy/rules/' + idx);

}

let FLOW_LAST_OUTPUT = '';

/* 把 Flow 执行结果 + 追加指令交给 LLM（走 /v1/chat，保留对话上下文） */
async function flowChat(promptPrefix, statusEl){
  if(FLOW_BUSY) return;
  const out = $('flow-out'), st = statusEl, inp = $('flow-follow');
  if(!FLOW_LAST_OUTPUT){
    if(st) st.textContent = '请先执行 Flow（或加载黑板记录）';
    return;
  }
  FLOW_BUSY = true;
  if(st) st.textContent = 'LLM 处理中…';
  const tail = FLOW_LAST_OUTPUT.length > 3000 ? FLOW_LAST_OUTPUT.slice(-3000) : FLOW_LAST_OUTPUT;
  const message = promptPrefix.replace('%RESULTS%', tail) + ((inp && inp.value.trim()) ? ('\n\n' + inp.value.trim()) : '');
  const c = await call('POST', '/v1/chat', {message});
  const id = c.obj && c.obj.id;
  if(id === undefined){
    if(st) st.textContent = '提交失败: ' + (c.text || ('HTTP ' + c.status));
    FLOW_BUSY = false;
    return;
  }
  for(let i = 0; i < 600; i++){
    const r = await call('GET', '/v1/tasks/' + id);
    const t = r.obj;
    if(st && t && t.status && t.status !== 'DONE') st.textContent = '状态: ' + t.status;
    if(t && (t.status === 'DONE' || t.status === 'FAILED' || t.status === 'CANCELLED' || t.status === 'TIMEOUT')){
      if(out) out.textContent = (out.textContent ? out.textContent + '\n\n' : '') + '—— LLM 回答 ——\n' + (t.output || '(无输出)');
      if(st) st.textContent = '';
      if(inp) inp.value = '';
      FLOW_BUSY = false;
      return;
    }
    await new Promise(res => setTimeout(res, 300));
  }
  if(st) st.textContent = '(等待超时，任务仍在后台执行)';
  FLOW_BUSY = false;
}

async function flowRun(){
  if(FLOW_BUSY) return;
  const ta = $('flow-json'), st = $('flow-status'), out = $('flow-out');
  if(!ta) return;
  let dag;
  try { dag = JSON.parse(ta.value); }
  catch(e){ if(st) st.textContent = 'JSON 解析失败: ' + e.message; return; }
  if(!dag.nodes){ if(st) st.textContent = '缺少 nodes 数组'; return; }
  FLOW_BUSY = true;
  if(st) st.textContent = '提交中…';
  if(out) out.textContent = '';
  const c = await call('POST', '/v1/flows', dag);
  const id = c.obj && c.obj.id;
  if(id === undefined){
    if(st) st.textContent = '提交失败: ' + (c.obj && c.obj.error ? c.obj.error : (c.text || ('HTTP ' + c.status)));
    FLOW_BUSY = false;
    return;
  }
  for(let i = 0; i < 600; i++){
    const r = await call('GET', '/v1/tasks/' + id);
    const t = r.obj;
    if(st) st.textContent = (t && t.status && t.status !== 'DONE') ? ('状态: ' + t.status) : '';
    if(t && (t.status === 'DONE' || t.status === 'FAILED' || t.status === 'CANCELLED' || t.status === 'TIMEOUT')){
      FLOW_LAST_OUTPUT = t.output || '';
      if(out) out.textContent = FLOW_LAST_OUTPUT ? ('—— Flow 输出 ——\n' + FLOW_LAST_OUTPUT) : '(无输出)';
      if(st) st.textContent = '';
      FLOW_BUSY = false;
      loadFlow();
      return;
    }
    await new Promise(res => setTimeout(res, 300));
  }
  if(st) st.textContent = '(等待超时，任务仍在后台执行)';
  FLOW_BUSY = false;
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

let LOCAL_ST = {};
async function localStatus(engine){
  const r = await call('GET', '/v1/local/status');
  LOCAL_ST = (r.obj && typeof r.obj === 'object') ? r.obj : {};
  const o = LOCAL_ST.ollama || {}, l = LOCAL_ST.llamacpp || {};
  const b1 = $('loc-ollama');
  if(b1){
    b1.textContent = o.running ? '● 运行中' : (o.installed ? '已安装 · 未运行' : '未安装');
    b1.className = 'badge ' + (o.running ? 'badge-ok' : (o.installed ? 'badge-warn' : 'badge-err'));
  }
  const b2 = $('loc-llamacpp');
  if(b2){
    b2.textContent = l.running ? '● 运行中' : '未检测到';
    b2.className = 'badge ' + (l.running ? 'badge-ok' : 'badge-err');
  }
  const m = $('loc-msg');
  if(m && engine) m.textContent = engine + ' 检测完成';
}

async function localStart(engine){
  const m = $('loc-msg');
  if(m) m.textContent = '正在启动 ' + engine + '…';
  const r = await call('POST', '/v1/local/start', {engine});
  const o = r.obj || {};
  if(o.ok){
    const running = o.already_running || o.spawned;
    const note = o.already_running ? (engine + ' 已在运行') : (o.note || ('已启动 ' + engine));
    if(m) m.textContent = note;
    toast(note);
    /* poll status for up to ~6s so the badge flips to running when ready */
    for(let i = 0; i < 6 && !running; i++){ await sleep(1000); await localStatus(null); }
    if(running) await localStatus(null);
  } else {
    const note = o.error || ('启动 ' + engine + ' 失败');
    if(m) m.textContent = note;
    toast(note);
  }
}

async function loadModels(){
  const r   = await call('GET', '/v1/routes');
  const cfg = await call('GET', '/v1/config/llm');
  ROUTES = Array.isArray(r.obj) ? r.obj : [];

  loadModelPlaza();

    rp.dataset.bound = '1';
    rp.addEventListener('change', () => {
      const p = PROVIDER_PRESETS[$('r-provider').value] || PROVIDER_PRESETS.openai;

      if(rm){ rm.placeholder = p.model || 'model (可选)'; if(!rm.value) rm.value = p.model; }

  if(st) st.textContent = 'active: ' + (ACTIVE.provider || '?')
      + (ACTIVE.model ? ' / ' + ACTIVE.model : '')
      + (ACTIVE.api_key_set ? '' : '（未配置 api_key）');
  const t = $('routes-body');
  if(!t) return;
  if(!ROUTES.length){ t.innerHTML = '<tr><td colspan="7" class="muted">（暂无路由）</td></tr>'; return; }

      + '<td>' + esc(x.name || '') + (isActive ? ' <span class="badge badge-ok">active</span>' : '') + '</td>'

      + '<td>' + esc(x.model || '') + '</td>'
      + '<td class="muted">' + esc(x.base_url || '') + '</td>'
      + '<td>' + (x.weight != null ? x.weight : 1) + '</td>'
      + '<td>' + (x.calls != null ? x.calls : 0) + '</td>'
      + '<td><button onclick="testRoute(' + i + ')" class="sec sm">Test</button> '
      + '<button onclick="setActive(' + i + ')" class="sec sm"' + (isActive ? ' disabled' : '') + '>Set active</button> '
      + '<button onclick="deleteRoute(' + i + ')" class="sec sm danger">Delete</button></td></tr>';
  }).join('');
}

async function setActive(i){
  const x = ROUTES[i]; if(!x) return;

  const r = await call('POST', '/v1/config/llm', {

  loadModels();
}

async function addRoute(){
  const name = $('r-name').value.trim();
  const provider = presetProvider();
  const msg = $('routes-msg');
  if(!name){ if(msg) msg.textContent = 'need name'; return; }
  const body = {
    name, provider,
    base_url: $('r-base').value.trim(),
    model: $('r-model').value.trim(),
    api_key: $('r-key').value.trim()
  };
  const w = parseFloat($('r-weight').value);
  if(!isNaN(w)) body.weight = w;
  const r = await call('POST', '/v1/routes', body);
  if(msg) msg.textContent = (r.status < 300) ? 'route saved'
      : (r.obj && r.obj.error) ? 'error: ' + r.obj.error : 'error ' + r.status;
  if(r.status < 300){
    $('r-name').value = ''; $('r-base').value = ''; $('r-key').value = ''; $('r-model').value = '';
  }
  loadModels();
}

/* Test an arbitrary LLM config against the live provider (no switch, no persist). */
async function testLlm(body, prefix){
  prefix = prefix || '';
  const st = $('models-stat'); if(st) st.textContent = '测试 ' + prefix + '请求中…';
  const r = await call('POST', '/v1/config/llm/test', body);
  const ok = r.obj && r.obj.ok;
  const detail = (r.obj && (r.obj.reply || r.obj.error)) || ('HTTP ' + r.status);
  if(st) st.textContent = (ok ? '✅ 测试通过 ' : '❌ 测试失败 ') + prefix + detail;
  toast((ok ? '✅ ' : '❌ ') + prefix + detail);
}

async function testRoute(i){
  const x = ROUTES[i]; if(!x) return;
  await testLlm({provider: x.provider, base_url: x.base_url || '', model: x.model || '', api_key: x.api_key || ''},
                '路由 ' + x.name + ' ');
}

async function testForm(){
  const provider = presetProvider();
  await testLlm({
    provider,
    base_url: $('r-base').value.trim(),
    model: $('r-model').value.trim(),
    api_key: ($('r-key') && $('r-key').value.trim()) || ''
  }, '表单配置 ');
}

/* ================= 导航 ================= */

const TITLES = {dashboard:'Dashboard', chat:'对话', agents:'Agents', policy:'策略', flow:'Flow', models:'Models', mcp:'MCP', skills:'Skills', plugins:'Plugins', im:'IM', memory:'Memory', snapshots:'Execution', trace:'Monitor', cluster:'Cluster', metrics:'Metrics'};
let current = 'dashboard';

function switchPanel(p){
  current = p;
  document.querySelectorAll('#nav button').forEach(b => {
    const on = b.dataset.p === p;
    b.classList.toggle('on', on);
    if(on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
  });
  const t = $('pageTitle'); if(t) t.textContent = TITLES[p] || p;
  $('content').innerHTML = panels[p];
  load(p);
  if(window.innerWidth < 900) toggleSidebar(false);
}

document.querySelectorAll('#nav button').forEach(b => {
  b.addEventListener('click', () => switchPanel(b.dataset.p));
});

function toggleSidebar(force){
  const open = typeof force === 'boolean' ? force : !$('sidebar').classList.contains('open');
  $('sidebar').classList.toggle('open', open);
  $('navToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
  $('backdrop').classList.toggle('on', open && window.innerWidth < 900);
}
$('navToggle').addEventListener('click', () => toggleSidebar());
$('backdrop').addEventListener('click', () => toggleSidebar(false));

$('btnRefresh').addEventListener('click', () => {
  if(current === 'tasks'){ toast('已在 Tasks 页'); return; }
  if(current === 'models') loadModels(); else load(current);
  toast('已刷新');
});

/* ================= 主题 ================= */

const THEMES = ['dark', 'light', 'ocean', 'forest', 'sunset'];
function applyTheme(t){
  if(!THEMES.includes(t)) t = 'dark';
  document.body.dataset.theme = t;
  try { localStorage.setItem('cognitive-os-agent-theme', t); } catch(e) {}
  const sel = $('theme'); if(sel) sel.value = t;
}
$('theme').addEventListener('change', e => applyTheme(e.target.value));
applyTheme(localStorage.getItem('cognitive-os-agent-theme') || 'dark');

/* ================= 连接状态 ================= */

async function pingServer(){
  const r = await call('GET', '/v1/config/llm');
  const ok = r.status !== 0;
  const dot = $('connDot'), txt = $('connText');
  if(dot){ dot.className = 'dot ' + (ok ? 'ok' : 'err'); }
  if(txt) txt.textContent = ok ? '已连接' : '离线';
}
setInterval(pingServer, 8000);

/* ================= 初始化 ================= */

$('content').innerHTML = panels.dashboard;
const imInput = $('im-input');
if(imInput) imInput.addEventListener('keydown', e => { if(e.key === 'Enter') imSend(); });
pingServer();
wsConnect();
loadDashboard();
</script>
