let FLOW_LAST_OUTPUT = '';

/* 把 Flow 执行结果 + 追加指令交给 LLM（走 /v1/chat，保留对话上下文） */
async function flowChat(promptPrefix, statusEl){
  if(FLOW_BUSY) return;
  const out = $('flow-out'), inp = $('flow-follow');
  /* 综合答案写 flow-status，继续对话写 flow-follow-status —— 轮询期间面板
   * 可能被重建，状态一律走 flowStatus（镜像 + 现查元素） */
  const which = (statusEl && statusEl.id === 'flow-follow-status') ? 'follow-status' : 'status';
  if(!FLOW_LAST_OUTPUT){
    flowStatus(which, '请先执行 Flow（或加载黑板记录）');
    return;
  }
  FLOW_BUSY = true;
  flowStatus(which, 'LLM 处理中…');
  const tail = FLOW_LAST_OUTPUT.length > 3000 ? FLOW_LAST_OUTPUT.slice(-3000) : FLOW_LAST_OUTPUT;
  const message = promptPrefix.replace('%RESULTS%', tail) + ((inp && inp.value.trim()) ? ('\n\n' + inp.value.trim()) : '');
  const c = await call('POST', '/v1/chat', {message, session: CHAT_SESSION});
  const id = c.obj && c.obj.id;
  if(id === undefined){
    flowStatus(which, '提交失败: ' + (c.text || ('HTTP ' + c.status)));
    FLOW_BUSY = false;
    return;
  }
  for(let i = 0; ; i++){
    const r = await call('GET', '/v1/tasks/' + id);
    const t = r.obj;
    if(r.status === 404 || (r.obj && r.obj.error && !t.status)){
      flowStatus(which, '⚠ 任务 #' + id + ' 已丢失（服务可能重启过）');
      FLOW_BUSY = false;
      return;
    }
    if(r.status === 0){
      flowStatus(which, '⚠ 服务连接失败，等待服务恢复…（' + (i + 1) + '）');
      if(i > 200){ flowStatus(which, '⚠ 服务长时间无响应，停止轮询'); FLOW_BUSY = false; return; }
      await new Promise(res => setTimeout(res, 300));
      continue;
    }
    if(t && t.status && t.status !== 'DONE')
      flowStatus(which, '状态: ' + t.status + (taskProgressText(t) ? ' · ' + taskProgressText(t) : ''));
    if(t && (t.status === 'DONE' || t.status === 'FAILED' || t.status === 'CANCELLED' || t.status === 'TIMEOUT')){
      FLOW_MIRROR.out = (FLOW_MIRROR.out ? FLOW_MIRROR.out + '\n\n' : '') + '—— LLM 回答 ——\n' + (t.output || '(无输出)');
      if(out && out.isConnected) out.textContent = FLOW_MIRROR.out;
      flowStatus(which, '');
      if(inp) inp.value = '';
      FLOW_BUSY = false;
      return;
    }
    await new Promise(res => setTimeout(res, 300));
  } /* poll until terminal status — no timeout */
}

async function flowRun(){
  if(FLOW_BUSY) return;
  const ta = $('flow-json'), st = $('flow-status'), out = $('flow-out');
  if(!ta) return;
  let dag;
  try { dag = JSON.parse(ta.value); }
  catch(e){ if(st) st.textContent = 'JSON 解析失败: ' + e.message; return; }
  if(!dag.nodes){ if(st) st.textContent = '缺少 nodes 数组'; return; }
  FLOW_BUSY = true;
  flowStatus('status', '提交中…');
  FLOW_MIRROR.out = '';
  if(out) out.textContent = '';
  const c = await call('POST', '/v1/flows', dag);
  const id = c.obj && c.obj.id;
  if(id === undefined){
    flowStatus('status', '提交失败: ' + (c.obj && c.obj.error ? c.obj.error : (c.text || ('HTTP ' + c.status))));
    FLOW_BUSY = false;
    return;
  }
  for(let i = 0; ; i++){
    const r = await call('GET', '/v1/tasks/' + id);
    const t = r.obj;
    if(r.status === 404 || (r.obj && r.obj.error && !t.status)){
      /* 任务不存在：服务重启后内存任务表清空（协作任务记录仍在 flows.json，可「继续」） */
      flowStatus('status', '⚠ 任务 #' + id + ' 已丢失（服务可能重启过）。可在下方「协作任务」列表里点「继续」恢复执行。');
      if(out && out.isConnected) out.textContent = FLOW_MIRROR.out + '\n\n⚠ 任务已丢失（服务重启），到「协作任务」列表点「继续」可恢复。';
      FLOW_BUSY = false;
      loadFlowTasks();
      return;
    }
    if(r.status === 0){
      /* 网络失败：服务可能崩溃/重启中，短暂等待重试（看门狗 ~20s 内拉起） */
      flowStatus('status', '⚠ 服务连接失败，等待服务恢复…（' + (i + 1) + '）');
      if(i > 200){ flowStatus('status', '⚠ 服务长时间无响应，停止轮询。服务恢复后到「协作任务」列表点「继续」。'); FLOW_BUSY = false; return; }
      await new Promise(res => setTimeout(res, 300));
      continue;
    }
    flowStatus('status', (t && t.status && t.status !== 'DONE')
      ? ('状态: ' + t.status + (taskProgressText(t) ? ' · ' + taskProgressText(t) : '')) : '');
    if(t && (t.status === 'DONE' || t.status === 'FAILED' || t.status === 'CANCELLED' || t.status === 'TIMEOUT')){
      FLOW_LAST_OUTPUT = t.output || '';
      FLOW_MIRROR.out = FLOW_LAST_OUTPUT ? ('—— Flow 输出 ——\n' + FLOW_LAST_OUTPUT) : '(无输出)';
      if(out && out.isConnected) out.textContent = FLOW_MIRROR.out;
      flowStatus('status', '');
      FLOW_BUSY = false;
      loadFlow();
      loadFlowTasks();
      return;
    }
    await new Promise(res => setTimeout(res, 300));
  } /* poll until terminal status — no timeout */
}

let LOCAL_ST = {};
async function localStatus(engine){

    b1.className = 'badge ' + (o.running ? 'badge-ok' : (o.installed ? 'badge-warn' : 'badge-err'));
  }
  const b2 = $('loc-llamacpp');
  if(b2){
    b2.textContent = l.running ? '● 运行中' : '未检测到';
    b2.className = 'badge ' + (l.running ? 'badge-ok' : 'badge-err');

async function localStart(engine){
  const m = $('loc-msg');
  if(m) m.textContent = '正在启动 ' + engine + '…';
  const r = await call('POST', '/v1/local/start', {engine});
  const o = r.obj || {};
  if(o.ok){
    const running = o.already_running || o.spawned;
    const note = o.already_running ? (engine + ' 已在运行') : (o.note || ('已启动 ' + engine));
    if(m) m.textContent = note;
    toast(note);
    /* poll status for up to ~6s so the badge flips to running when ready */
    for(let i = 0; i < 6 && !running; i++){ await sleep(1000); await localStatus(null); }
    if(running) await localStatus(null);
  } else {
    const note = o.error || ('启动 ' + engine + ' 失败');
    if(m) m.textContent = note;
    toast(note);
  }
}

/* ===== 拉取供应商可用模型列表（issue #18）===== */
let FETCHED_MODELS = [];

async function fetchModels(){
  const st = $('models-fetch-stat');
  const box = $('fetched-models');
  const btn = $('models-addall');
  const provider = presetProvider();
  const base = $('r-base').value.trim();
  const key = $('r-key').value.trim();
  if(!base){ if(st) st.textContent = '先填 base_url'; return; }
  if(st) st.textContent = '请求中…';
  if(box) box.innerHTML = '<span class="muted" style="font-size:12px">请求中…</span>';
  const r0 = await call('POST', '/v1/routes/models', {provider, base_url: base, api_key: key});
  if(!(r0.status < 300)){
    if(st) st.textContent = '❌ ' + ((r0.obj && r0.obj.error) || ('HTTP ' + r0.status));
    return;
  }
  for(let i = 0; i < 40; i++){ /* 最多等 20s */
    const r = await call('GET', '/v1/routes/models');
    const o = r.obj || {};
    if(o.pending){ await new Promise(res => setTimeout(res, 500)); continue; }
    if(!o.ok){
      FETCHED_MODELS = [];
      if(box) box.innerHTML = '<span class="muted" style="font-size:12px">（拉取失败：' + esc(o.error || '未知错误') + '）</span>';
      if(st) st.textContent = '❌ ' + (o.error || '拉取失败');
      if(btn) btn.style.display = 'none';
      return;
    }
    FETCHED_MODELS = Array.isArray(o.models) ? o.models : [];
    renderFetchedModels();
    if(st) st.textContent = '✅ 拉取到 ' + FETCHED_MODELS.length + ' 个模型，点击即创建路由并激活，也可全部创建';
    return;
  }
  if(st) st.textContent = '❌ 拉取超时';
}

function renderFetchedModels(){
  const box = $('fetched-models');
  const btn = $('models-addall');
  if(!box) return;
  if(!FETCHED_MODELS.length){
    box.innerHTML = '<span class="muted" style="font-size:12px">（无可用模型）</span>';
    if(btn) btn.style.display = 'none';
    return;
  }
  box.innerHTML = FETCHED_MODELS.map(m =>
    '<button class="sec sm" onclick="pickFetchedModel(\'' + esc(String(m).replace(/'/g, "\\'")) + '\')" ' +
    'title="点击创建该模型的路由并激活；也可用「全部创建」批量建路由">' + esc(String(m)) + '</button>').join(' ');
  if(btn) btn.style.display = '';
}

/* 点模型 chip = 直接创建该模型的路由（不存在才建）并立即激活 */
async function pickFetchedModel(m){
  const provider = presetProvider();
  const base = $('r-base') ? $('r-base').value.trim() : '';
  const key = $('r-key') ? $('r-key').value.trim() : '';
  const name = (provider + '-' + String(m).replace(/[^A-Za-z0-9._-]/g, '-')).slice(0, 60);
  const have = new Set(ROUTES.map(x => x.name));
  if(!have.has(name)){
    const r = await call('POST', '/v1/routes', {name, provider, base_url: base, model: m, api_key: key, weight: 1});
    if(!(r.status < 300)){ toast('创建路由失败：HTTP ' + r.status); return; }
  }
  const inp = $('r-model'); if(inp) inp.value = m;
  const st = $('models-stat'); if(st) st.textContent = 'switching…';
  const a = await call('POST', '/v1/config/llm', {provider, base_url: base, model: m, api_key: key});
  if(st) st.textContent = (a.obj && a.obj.ok) ? 'switched to ' + m : 'error: ' + ((a.obj && a.obj.error) || a.status);
  toast('已创建并激活 ' + m + '，其他模型点 chip 即可切换');
  loadModels();
}

/* 一键把拉取到的模型全部建成路由：命名 <provider>-<model>，重名自动跳过 */
async function addFetchedModels(){
  if(!FETCHED_MODELS.length) return;
  const st = $('models-fetch-stat');
  const provider = presetProvider();
  const base = $('r-base').value.trim();
  const key = $('r-key').value.trim();
  const have = new Set(ROUTES.map(x => x.name));
  let created = 0, skipped = 0;
  for(const m of FETCHED_MODELS){
    const name = (provider + '-' + String(m).replace(/[^A-Za-z0-9._-]/g, '-')).slice(0, 60);
    if(have.has(name)){ skipped++; continue; }
    have.add(name);
    const r = await call('POST', '/v1/routes', {name, provider, base_url: base, model: m, api_key: key, weight: 1});
    if(r.status < 300) created++; else skipped++;
  }
  if(st) st.textContent = '✔ 已创建 ' + created + ' 条路由' + (skipped ? '（跳过 ' + skipped + ' 条已存在）' : '');
  toast('已创建 ' + created + ' 条模型路由，可在 Model routes 里 Set active 切换');
  loadModels();
}

async function addRoute(){
  const name = $('r-name').value.trim();
  const provider = presetProvider();
  const msg = $('routes-msg');
  if(!name){ if(msg) msg.textContent = 'need name'; return; }
  const body = {
    name, provider,
    base_url: $('r-base').value.trim(),
    model: $('r-model').value.trim(),
    api_key: $('r-key').value.trim()
  };
  const w = parseFloat($('r-weight').value);
  if(!isNaN(w)) body.weight = w;
  const r = await call('POST', '/v1/routes', body);
  if(msg) msg.textContent = (r.status < 300) ? 'route saved'
      : (r.obj && r.obj.error) ? 'error: ' + r.obj.error : 'error ' + r.status;
  if(r.status < 300){
    $('r-name').value = ''; $('r-base').value = ''; $('r-key').value = ''; $('r-model').value = '';
  }
  loadModels();
}

/* Test an arbitrary LLM config against the live provider (no switch, no persist).
 * 异步探测：POST 启动后台线程探测，GET 轮询结果 — 探测期间服务器可以继续
 * 响应其他界面请求（issue #3）。 */
async function testLlm(body, prefix){
  prefix = prefix || '';
  const st = $('models-stat'); if(st) st.textContent = '测试 ' + prefix + '请求中…';
  const r0 = await call('POST', '/v1/config/llm/test', body);
  if(r0.obj && r0.obj.error && !r0.obj.pending){
    if(st) st.textContent = '❌ 测试失败 ' + prefix + r0.obj.error;
    toast('❌ ' + prefix + r0.obj.error);
    return;
  }
  for(let i = 0; i < 120; i++){ /* 最多等 60s */
    const r = await call('GET', '/v1/config/llm/test');
    const o = r.obj || {};
    if(o.pending){ await new Promise(res => setTimeout(res, 500)); continue; }
    const ok = o.ok;
    const detail = o.reply || o.error || ('HTTP ' + r.status);
    if(st) st.textContent = (ok ? '✅ 测试通过 ' : '❌ 测试失败 ') + prefix + detail;
    toast((ok ? '✅ ' : '❌ ') + prefix + detail);
    return;
  }
  if(st) st.textContent = '❌ 测试超时 ' + prefix;
  toast('❌ ' + prefix + '测试超时');
}

async function testRoute(i){

}

  document.querySelectorAll('#nav button').forEach(b => {
    const on = b.dataset.p === p;
    b.classList.toggle('on', on);

  });
  const t = $('pageTitle'); if(t) t.textContent = TITLES[p] || p;

      const sub = $(b.dataset.g);

      document.querySelectorAll('nav .navsub').forEach(s => s.classList.remove('open'));

function toggleSidebar(force){
  const open = typeof force === 'boolean' ? force : !$('sidebar').classList.contains('open');
  $('sidebar').classList.toggle('open', open);
  $('navToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
  $('backdrop').classList.toggle('on', open && window.innerWidth < 900);
}
$('navToggle').addEventListener('click', () => toggleSidebar());
$('backdrop').addEventListener('click', () => toggleSidebar(false));

$('btnRefresh').addEventListener('click', () => {
  if(current === 'tasks'){ toast('已在 Tasks 页'); return; }
  if(current === 'models') loadModels(); else load(current);
  toast('已刷新');
});

/* ================= 主题 ================= */

const THEMES = ['dark', 'light', 'ocean', 'forest', 'sunset'];
function applyTheme(t){
  if(!THEMES.includes(t)) t = 'dark';
  document.body.dataset.theme = t;
  try { localStorage.setItem('cognitive-os-agent-theme', t); } catch(e) {}
  const sel = $('theme'); if(sel) sel.value = t;
}
$('theme').addEventListener('change', e => applyTheme(e.target.value));
/* Task-local presentation. No model reasoning or raw planner logs are rendered. */
const CHAT_SUBMITTING = new Set();
const CHAT_POLLERS = new Set();
const CHAT_ENTRIES = new Map();
const STAGE_LABELS = {
  steering:'已收到补充，等待当前操作结束', replanning:'正在根据补充调整任务',
  submitting:'已收到，正在准备', queued:'等待执行', analyzing:'正在分析需求',
  planning:'思考中 · 正在规划下一步', executing:'正在执行',
  summarizing:'正在整理结果', completed:'执行完成', failed:'执行失败',
  cancelled:'已取消', timed_out:'执行超时', reconnecting:'连接中断，正在重试',
  cancelling:'正在取消，等待当前操作结束'
};
const TOOL_LABELS = {file:'处理文件', shell:'运行命令', git:'检查代码仓库',
  search:'检索资料', web_search:'搜索网页', mcp:'调用连接工具', skill:'执行技能'};
function progressLabel(p){
  return p.stage === 'executing' && p.cur_tool
    ? (TOOL_LABELS[p.cur_tool] || '执行工具') + ' · ' + p.cur_tool
    : (STAGE_LABELS[p.stage] || '正在处理');
}
function chatPersist(){
  try {
    const records = Object.entries(CHAT_CACHE).slice(-12).map(([session, msgs]) => [session,
      msgs.slice(-40).map(({role,text,pending,progress,taskId}) => ({role,text,pending,progress,taskId}))]);
    sessionStorage.setItem('cognitive-progress-v1', JSON.stringify({records,tasks:CHAT_TASKS}));
  } catch(e) { /* storage quota/private mode: in-memory state remains usable */ }
}
function chatRestore(){
  try {
    const saved = JSON.parse(sessionStorage.getItem('cognitive-progress-v1') || 'null');
    if(!saved || !Array.isArray(saved.records)) return;
    for(const [session,msgs] of saved.records){
      if(!Array.isArray(msgs)) continue;
      CHAT_CACHE[session] = msgs;
      for(const entry of msgs){
        if(Number.isInteger(entry.taskId) && entry.pending && saved.tasks?.[session] === entry.taskId){
          CHAT_TASKS[session] = entry.taskId;
          CHAT_ENTRIES.set(entry.taskId, {session,entry});
          void chatPollTask(session, entry.taskId, entry);
        }
      }
    }
  } catch(e) { /* ignore invalid/old stored state */ }
}
function renderChatEntry(entry){
  const el = entry.el;
  if(!el?.isConnected || entry.role !== 'bot') return;
  const follow = chatNearBottom();
  const previous = el.querySelector('details');
  const wasOpen = previous?.open;
  el.replaceChildren();
  const p = entry.progress;
  if(p){
    const panel = document.createElement('details'); panel.className = 'run-card';
    panel.open = wasOpen === undefined ? !!entry.pending : wasOpen;
    const summary = document.createElement('summary');
    const dot = document.createElement('span');
    dot.className = 'run-dot' + (entry.pending ? ' active' : '') + (p.stage === 'failed' ? ' error' : '');
    const label = document.createElement('span'); label.className = 'run-label';
    label.textContent = progressLabel(p);
    label.setAttribute('role','status'); label.setAttribute('aria-live','polite');
    const elapsed = document.createElement('span'); elapsed.className = 'run-time';
    const ms = entry.pending && p.started_ms ? Math.max(0,Date.now()-p.started_ms) : (p.elapsed_ms || 0);
    elapsed.textContent = ms ? Math.floor(ms/1000) + ' 秒' : '';
    summary.append(dot,label,elapsed); panel.append(summary);
    const list = document.createElement('ol'); list.className = 'run-steps';
    const steps = Array.isArray(p.steps) ? p.steps : [];
    for(const s of steps){
      const item = document.createElement('li');
      item.dataset.state = s.ok === 1 ? 'done' : s.ok === 0 ? 'failed' : 'skipped';
      const title = document.createElement('span');
      title.textContent = (s.ok === 1 ? '✓ ' : s.ok === 0 ? '× ' : '− ') + (TOOL_LABELS[s.tool] || s.tool || '操作');
      const meta = document.createElement('small');
      meta.textContent = (s.ok === 1 ? '已完成' : s.ok === 0 ? '失败' : '已跳过') + ' · ' + ((s.ms || 0)/1000).toFixed(1) + ' 秒';
      item.append(title,meta); list.append(item);
    }
    if(entry.pending){
      const item = document.createElement('li'); item.dataset.state = 'running';
      item.textContent = progressLabel(p); list.append(item);
    }
    if(!steps.length && !entry.pending){
      const item = document.createElement('li'); item.textContent = '本次任务未调用工具'; list.append(item);
    }
    panel.append(list); el.append(panel);
  }
  if(entry.text && !entry.pending){
    const answer = document.createElement('pre'); answer.className = 'chat-answer';
    answer.textContent = entry.text; el.append(answer);
  }
  if(follow) chatScroll(true);
}
function chatNearBottom(){
  const box = $('chat-box'); return !box || box.scrollHeight-box.scrollTop-box.clientHeight < 100;
}
function chatApplyProgress(session,id,p){
  const binding = CHAT_ENTRIES.get(id);
  if(!binding || binding.session !== session || !binding.entry.pending) return;
  const entry = binding.entry;
  if(p.session_id && p.session_id !== session) return;
  if(p.seq && entry.progress?.seq > p.seq) return;
  entry.progress = {...entry.progress, ...p};
  if(entry.steeringRevision > (p.applied_updates || 0)) entry.progress.stage = 'steering';
  if(entry.cancelling) entry.progress.stage = 'cancelling';
  renderChatEntry(entry); chatPersist();
}
function chatFinish(session,id,entry,text,stage){
  entry.pending = false; entry.text = text;
  entry.progress = {...entry.progress, stage,
    elapsed_ms: entry.progress?.started_ms ? Date.now()-entry.progress.started_ms : 0};
  delete CHAT_TASKS[session]; CHAT_ENTRIES.delete(id);
  renderChatEntry(entry);
  if(entry.el?.querySelector('details')) entry.el.querySelector('details').open = false;
  if(CHAT_SESSION === session){
    CHAT_TASK_ID = null; CHAT_RESUME_OK = stage !== 'completed'; chatBusyUI(false);
    const status = $('chat-status'); if(status) status.textContent = '';
  }
  chatPersist(); void loadChatSessions();
}
async function chatPollTask(session,id,entry){
  if(CHAT_POLLERS.has(id)) return;
  CHAT_POLLERS.add(id);
  let failures = 0;
  try {
    while(CHAT_TASKS[session] === id){
      const r = await call('GET','/v1/tasks/' + id);
      if(r.status === 404){ chatFinish(session,id,entry,'任务已不存在，服务可能重启。可以重新发送或恢复任务。','failed'); return; }
      if(r.status === 401 || r.status === 403){
        chatApplyProgress(session,id,{stage:'reconnecting'});
        if(CHAT_SESSION === session) $('chat-status').textContent = '访问被拒绝，请检查连接权限；恢复后将继续同步';
        await sleep(15000); continue;
      }
      if(r.status !== 200 || !r.obj?.status){
        failures++;
        chatApplyProgress(session,id,{stage:'reconnecting'});
        await sleep(Math.min(10000,500 * 2 ** Math.min(failures,5))); continue;
      }
      failures = 0;
      const t = r.obj;
      chatApplyProgress(session,id,t);
      const final = {DONE:'completed',FAILED:'failed',CANCELLED:'cancelled',TIMEOUT:'timed_out'}[t.status];
      if(final){
        chatFinish(session,id,entry,t.output && t.output !== '(no output)' ? t.output : (STAGE_LABELS[final] + '，没有返回内容。'),final);
        return;
      }
      await sleep(800);
    }
  } finally { CHAT_POLLERS.delete(id); }
}
async function chatSubmit(resume = false){
  if(chatIsBusy()){
    if(!resume && !CHAT_SUBMITTING.has(CHAT_SESSION)) return chatSteer();
    toast('正在提交消息，请稍候'); return;
  }
  const session = CHAT_SESSION, input = $('chat-input');
  if(!resume && input?.disabled) { toast('请先配置对话模型'); return; }
  const msg = input?.value.trim() || '';
  if(!resume && !msg && !CHAT_ATTACH.length) return;
  const attachments = CHAT_ATTACH.slice();
  const full = resume ? '（恢复）继续上一次任务' :
    (attachments.length ? '[附件: ' + attachments.map(a=>a.name).join(', ') + ']\n' : '') + msg;
  CHAT_SUBMITTING.add(session); chatBusyUI(true);
  if(input && !resume) input.value = '';
  chatAddBubble('user',full);
  chatAddBubble('bot','');
  const entry = CHAT_MSGS[CHAT_MSGS.length-1];
  entry.pending = true; entry.progress = {stage:'submitting'};
  CHAT_CACHE[session] = CHAT_MSGS; renderChatEntry(entry);
  const r = await call('POST',resume ? '/v1/chat/sessions/' + encodeURIComponent(session) + '/resume' : '/v1/chat',
    resume ? {} : {message:full,session});
  CHAT_SUBMITTING.delete(session);
  if(!Number.isInteger(r.obj?.id)){
    entry.pending = false; entry.progress.stage = 'failed';
    entry.text = r.status === 0 ? '连接中断，无法确认是否已提交。请检查任务列表后重试，避免重复执行。' : '提交失败：' + (r.obj?.error || r.status);
    renderChatEntry(entry); chatPersist();
    if(CHAT_SESSION === session) chatBusyUI(false);
    return;
  }
  const id = r.obj.id; entry.taskId = id; entry.progress = {stage:'queued'};
  CHAT_TASKS[session] = id; CHAT_ENTRIES.set(id,{session,entry});
  if(CHAT_SESSION === session){
    CHAT_TASK_ID = id; CHAT_NEW_SESSION = false; CHAT_RESUME_OK = false;
    CHAT_ATTACH = CHAT_ATTACH.filter(a=>!attachments.includes(a)); chatAttachRender(); chatBusyUI(true);
  }
  renderChatEntry(entry); chatPersist(); void loadChatSessions();
  await chatPollTask(session,id,entry);
}
async function chatSteer(){
  const session = CHAT_SESSION, id = chatTaskOf(session), input = $('chat-input');
  const message = input?.value.trim();
  if(!message || id === null) return;
  if(CHAT_ATTACH.length){ toast('任务补充暂不支持新附件，请先移除附件或等待任务完成'); return; }
  CHAT_SUBMITTING.add(session); chatBusyUI(true);
  const r = await call('POST','/v1/tasks/' + id + '/messages',{message,session});
  CHAT_SUBMITTING.delete(session);
  if(CHAT_SESSION === session) chatBusyUI(chatIsBusy(session));
  if(r.status !== 202){
    toast(r.status === 409 ? '任务已进入收尾，请在完成后发送；内容已保留' : '补充未确认送达，内容已保留，请检查连接'); return;
  }
  if(CHAT_SESSION === session){ input.value = ''; chatAddBubble('user',message); }
  else (CHAT_CACHE[session] ||= []).push({role:'user',text:message,pending:false});
  const binding = CHAT_ENTRIES.get(id);
  if(binding){ binding.entry.steeringRevision = r.obj.revision; chatApplyProgress(session,id,{stage:'steering'}); }
  chatPersist();
}
function chatSend(){ return chatSubmit(false); }
function chatResume(){ return chatSubmit(true); }
async function chatCancel(){
  const id = CHAT_TASK_ID, binding = CHAT_ENTRIES.get(id);
  if(id === null) return;
  const r = await call('DELETE','/v1/tasks/' + id);
  if(r.status >= 200 && r.status < 300){
    if(binding){ binding.entry.cancelling = true; chatApplyProgress(binding.session,id,{stage:'cancelling'}); }
  } else toast('取消请求未成功，请检查连接后重试');
}
chatRestore();

applyTheme(localStorage.getItem('cognitive-os-agent-theme') || 'dark');

/* ================= 连接状态 ================= */

async function pingServer(){
  const r = await call('GET', '/v1/config/llm');
  const ok = r.status !== 0;
  const dot = $('connDot'), txt = $('connText');
  if(dot){ dot.className = 'dot ' + (ok ? 'ok' : 'err'); }
  if(txt) txt.textContent = ok ? '已连接' : '离线';
}
setInterval(pingServer, 8000);

/* ================= 初始化 ================= */
/* ChatGPT 风格：对话是默认首页 */
switchPanel('chat');
const imInput = $('im-input');
if(imInput) imInput.addEventListener('keydown', e => { if(e.key === 'Enter') imSend(); });
pingServer();
wsConnect();
</script>
