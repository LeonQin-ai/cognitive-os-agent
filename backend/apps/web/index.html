<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>cognitive-os-agent — Cognitive OS Console</title>
<style>
  /* ---------- design tokens ---------- */
  :root{
    --radius:10px; --radius-sm:7px; --radius-xs:5px;
    --tr-dur:150ms;
    --mono:ui-monospace,"Cascadia Code",Consolas,"JetBrains Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei","PingFang SC",sans-serif;
    --side-w:232px;
  }
  /* base = dark theme (ChatGPT-style palette per UI.png) */
  body{
    margin:0; font-family:var(--sans); font-size:13px; line-height:1.5;
    color-scheme:dark;
    background:#212121; color:#ececec;
    --bg:#212121; --card:#2f2f2f; --border:rgba(255,255,255,.09);
    --fg:#ececec; --muted:#b4b4b4;
    --accent:#7c5cff; --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
    --sidebar:#171717; --nav-hover:#2a2a2a; --nav-on:#2f2f2f; --input:#2f2f2f;
    --code-num:#c084fc;
    --accent-soft:color-mix(in srgb, var(--accent) 13%, transparent);
    --accent-ring:color-mix(in srgb, var(--accent) 42%, transparent);
    --card-hover:color-mix(in srgb, var(--fg) 4%, var(--card));
    --shadow:0 1px 2px rgba(0,0,0,.28), 0 12px 32px rgba(0,0,0,.24);
    --shadow-sm:0 1px 2px rgba(0,0,0,.2);
    display:flex; height:100vh; overflow:hidden;
  }
  body[data-theme=light]{
    color-scheme:light;
    background:#f3f5f9; color:#1b2233;
    --bg:#f3f5f9; --card:#ffffff; --border:#dfe4ee;
    --fg:#1b2233; --muted:#5b6478;
    --accent:#2563eb; --ok:#059669; --warn:#b45309; --danger:#dc2626;
    --sidebar:#e9edf4; --nav-hover:#dfe5ef; --nav-on:#ffffff; --input:#d3dbe8;
    --code-num:#7c3aed;
    --shadow:0 1px 3px rgba(23,34,58,.08), 0 12px 32px rgba(23,34,58,.12);
    --shadow-sm:0 1px 2px rgba(23,34,58,.06);
  }
  body[data-theme=ocean]{
    color-scheme:dark;
    background:#081120; color:#d8e9ff;
    --bg:#081120; --card:#0d1a2d; --border:#1c3350;
    --fg:#d8e9ff; --muted:#7fa3c9;
    --accent:#38bdf8; --ok:#34d399; --warn:#fbbf24; --danger:#fb7185;
    --sidebar:#060d18; --nav-hover:#0e2138; --nav-on:#113052; --input:#1c3350;
    --code-num:#a5b4fc;
  }
  body[data-theme=forest]{
    color-scheme:dark;
    background:#0c1310; color:#d9f2e4;
    --bg:#0c1310; --card:#132019; --border:#21372c;
    --fg:#d9f2e4; --muted:#8fb8a0;
    --accent:#34d399; --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
    --sidebar:#0a100c; --nav-hover:#15241c; --nav-on:#1a3a2a; --input:#21372c;
    --code-num:#86efac;
  }
  body[data-theme=sunset]{
    color-scheme:dark;
    background:#160f1a; color:#f1e3f0;
    --bg:#160f1a; --card:#221a26; --border:#392b41;
    --fg:#f1e3f0; --muted:#b19ab3;
    --accent:#e879f9; --ok:#4ade80; --warn:#fbbf24; --danger:#fb7185;
    --sidebar:#110c15; --nav-hover:#291e2e; --nav-on:#392b41; --input:#392b41;
    --code-num:#f0abfc;
  }

  *{box-sizing:border-box}
  ::selection{background:var(--accent-ring)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  aside{
    width:var(--side-w); flex-shrink:0; height:100vh;
    background:var(--sidebar); border-right:1px solid var(--border);
    display:flex; flex-direction:column; z-index:30; transition:transform var(--tr-dur) ease;
  }
  /* ChatGPT 风格：圆角导航项 + “新聊天”首项 + 最近会话区 */
  nav button{
    border-left:0; border-radius:8px; margin:1px 8px; padding:9px 12px;
  }
  /* 可折叠分组（插件 / 更多） */
  nav button.navgroup{position:relative}
  nav button.navgroup .chev{
    position:absolute; right:10px; opacity:.6; transition:transform var(--tr-dur) ease;
  }
  nav button.navgroup.open .chev{transform:rotate(180deg)}
  nav .navsub{display:none; padding:1px 0 3px}
  nav .navsub.open{display:block}
  nav .navsub button{
    padding:7px 12px 7px 36px; font-size:12.5px; color:var(--muted); margin:0 8px;
  }
  nav .navsub button:hover{color:var(--fg)}
  nav .navsub button.on{background:var(--nav-on); color:var(--fg)}
  nav button.on, nav button[aria-current="true"]{ border-left-color:transparent }
  nav .side-sec{
    color:var(--muted); font-size:11px; padding:14px 20px 4px; letter-spacing:.4px;
  }
  #side-recent{padding:0 8px 8px}
  #side-recent button{
    display:flex; align-items:center; gap:8px; width:100%;
    background:none; border:0; border-radius:8px; color:var(--muted);
    padding:7px 12px; font-size:12.5px; cursor:pointer; text-align:left;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #side-recent button:hover{background:var(--nav-hover); color:var(--fg)}
  #side-recent button.on{background:var(--nav-on); color:var(--fg)}
  .newchat svg{flex-shrink:0}
  .usercard{display:flex; align-items:center; gap:10px; padding:4px 2px}
  .usercard .avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
    background:linear-gradient(135deg, var(--accent), #4f39c9); color:#fff; font-weight:700; font-size:13px;
  }
  .usercard .uname{font-size:13px; font-weight:600}
  .usercard .usub{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px}
  .chat-wrap{max-width:768px; margin:0 auto; width:100%; flex:1; display:flex; flex-direction:column; padding:24px 16px 12px}
  #chat-hero{margin:auto 0; text-align:center; display:flex; flex-direction:column; gap:22px; align-items:center}
  #chat-hero .hero-title{font-size:30px; font-weight:600; letter-spacing:.3px}
  #chat-hero .hero-subs{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  #chat-hero .chip{
    background:var(--card); border:1px solid var(--border); color:var(--muted);
    border-radius:18px; padding:8px 16px; font-size:13px; cursor:pointer;
  }
  #chat-hero .chip:hover{color:var(--fg); border-color:var(--muted)}
  .pillbar{
    display:flex; align-items:flex-end; gap:6px;
    background:var(--card); border:1px solid var(--border); border-radius:26px;
    padding:8px 10px; margin-top:12px; box-shadow:var(--shadow-sm);
  }
  .pillbar textarea{
    flex:1; background:none; border:0; color:var(--fg); outline:none; resize:none;
    font:inherit; line-height:1.5; padding:6px 4px; max-height:160px;
  }
  .pillbar textarea::placeholder{color:var(--muted)}
  .pillbar .pill-ic{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:none; border:0; color:var(--muted); font-size:19px; cursor:pointer; line-height:1;
  }
  .pillbar .pill-ic:hover{background:var(--nav-hover); color:var(--fg)}
  .pillbar .pill-send{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:var(--accent); border:0; color:#fff; font-size:16px; cursor:pointer; line-height:1;
  }
  .pillbar .pill-send:hover{filter:brightness(1.12)}
  .brand{display:flex; align-items:center; gap:10px; padding:16px 14px 14px; border-bottom:1px solid var(--border)}
  .logo{
    width:34px; height:34px; border-radius:9px; flex-shrink:0; display:grid; place-items:center;
    background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #000 0%));
    color:#fff; font-size:17px; font-weight:800; letter-spacing:-1px; user-select:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 6px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .brand h1{margin:0; font-size:15px; font-weight:700; letter-spacing:.2px}
  .brand .sub{color:var(--muted); font-size:11px; margin-top:1px}
  nav{flex:1; overflow-y:auto; padding:8px 0}
  nav button{
    display:flex; align-items:center; gap:10px; width:100%;
    background:none; border:0; border-left:3px solid transparent;
    color:var(--muted); padding:8px 13px; font-size:13px; cursor:pointer; text-align:left;
    transition:color var(--tr-dur), background var(--tr-dur);
  }
  nav button svg{flex-shrink:0; opacity:.9}
  nav button:hover{background:var(--nav-hover); color:var(--fg)}
  nav button:focus-visible{outline:2px solid var(--accent-ring); outline-offset:-2px}
  nav button.on, nav button[aria-current="true"]{
    background:var(--nav-on); border-left-color:var(--accent); color:var(--fg); font-weight:600;
  }
  .side-foot{padding:12px 14px; border-top:1px solid var(--border)}
  .conn{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted)}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0}
  .dot.ok{background:var(--ok)}
  .dot.warn{background:var(--warn)}
  .dot.err{background:var(--danger)}
  .dot.pulse{animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

  main{flex:1; display:flex; flex-direction:column; min-width:0; height:100vh}
  .top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 18px; border-bottom:1px solid var(--border); background:var(--card); flex-shrink:0;
  }
  .top-left{display:flex; align-items:center; gap:10px; min-width:0}
  .title{font-size:14px; font-weight:650; letter-spacing:.2px; outline:none}
  .flow{color:var(--muted); font-size:11px; letter-spacing:.45px; white-space:nowrap; user-select:none}
  .topright{display:flex; align-items:center; gap:10px}
  .icon-btn{
    width:32px; height:32px; display:grid; place-items:center;
    background:none; border:1px solid transparent; border-radius:var(--radius-sm);
    color:var(--muted); cursor:pointer; padding:0;
    transition:color var(--tr-dur), background var(--tr-dur), border-color var(--tr-dur);
  }
  .icon-btn:hover{color:var(--fg); background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 30%, transparent)}
  .icon-btn:focus-visible{outline:2px solid var(--accent-ring); outline-offset:2px}
  #navToggle{display:none}
  .content{flex:1; padding:20px; overflow-y:auto; scrollbar-gutter:stable}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow-sm)}
  .card h2{margin:0 0 4px; font-size:13px; font-weight:650}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px}
  .card-head h2{margin:0}
  .card-head .row{margin:0; gap:6px}
  .hint{color:var(--muted); font-size:12px; margin:0 0 10px; line-height:1.65}
  .muted{color:var(--muted)}

  textarea,input[type=text],input[type=number],select{
    width:100%; background:var(--bg); color:var(--fg);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:8px 10px; font-size:12.5px;
    transition:border-color var(--tr-dur), box-shadow var(--tr-dur);
  }
  textarea,input[type=text],input[type=number]{font-family:var(--mono)}
  textarea:focus,input[type=text]:focus,input[type=number]:focus,select:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring);
  }
  textarea{height:76px; resize:vertical; line-height:1.55}
  select{height:34px; width:auto; min-width:96px; cursor:pointer; font-family:var(--sans); font-size:12.5px; padding:0 26px 0 10px}
  ::placeholder{color:var(--muted); opacity:.75}

  button{
    background:var(--accent); color:#fff; border:0; border-radius:var(--radius-sm);
    padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
    transition:filter var(--tr-dur), transform var(--tr-dur), background var(--tr-dur), border-color var(--tr-dur), color var(--tr-dur);
  }
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent-ring); outline-offset:2px}
  button:disabled{opacity:.5; cursor:not-allowed; filter:none; transform:none}
  button.sec{background:var(--card); border:1px solid var(--border); color:var(--fg)}
  button.sec:hover{background:var(--card-hover)}
  button.danger{background:transparent; color:var(--danger); border:1px solid var(--danger)}
  button.danger:hover{background:color-mix(in srgb, var(--danger) 12%, transparent)}
  button.sm{padding:4px 9px; font-size:11.5px; font-weight:600}
  a.tag{display:inline-block; font-size:10px; font-weight:700; color:var(--accent);
       border:1px solid var(--accent); border-radius:8px; padding:0 6px; margin-left:6px; text-decoration:none; vertical-align:1px}
  a.tag:hover{background:color-mix(in srgb, var(--accent) 14%, transparent)}
  .item b a{color:var(--fg); text-decoration:none}
  .item b a:hover{color:var(--accent)}
  .row{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap}

  pre{
    background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px; font-size:12px; line-height:1.55; margin:0;
    overflow:auto; white-space:pre-wrap; word-break:break-word;
    max-height:55vh; min-height:56px; font-family:var(--mono);
  }
  .json .k{color:var(--accent); font-weight:600}
  .json .s{color:var(--ok)}
  .json .b{color:var(--warn)}
  .json .num{color:var(--code-num)}
  .json .n{color:var(--danger)}
  .json .p{color:var(--muted)}
  .json .empty{color:var(--muted); font-style:italic}

  .table-wrap{overflow:auto; border:1px solid var(--border); border-radius:var(--radius-sm); margin-top:8px}
  table{width:100%; border-collapse:collapse; font-size:12.5px}
  thead th{position:sticky; top:0; z-index:1; background:var(--card); text-align:left; padding:9px 12px; border-bottom:1px solid var(--border); color:var(--muted); font-weight:600; white-space:nowrap}
  td{padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:top}
  tbody tr{transition:background var(--tr-dur)}
  tbody tr:hover{background:var(--card-hover)}
  tr.active-row td{background:var(--accent-soft)}
  tr.active-row td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

  .badge{display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap}
  .badge-ok{background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok)}
  .badge-warn{background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn)}
  .badge-err{background:color-mix(in srgb, var(--danger) 16%, transparent); color:var(--danger)}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{
    display:inline-flex; align-items:center; gap:6px; max-width:100%;
    padding:4px 10px; background:var(--bg); border:1px solid var(--border);
    border-radius:999px; font-size:12px; cursor:pointer; color:var(--fg);
    transition:border-color var(--tr-dur), color var(--tr-dur);
  }
  .chip b{color:var(--muted); font-weight:700; flex-shrink:0}
  .chip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chip:hover{border-color:var(--accent); color:var(--accent)}

  .toast{position:fixed; bottom:24px; left:50%; transform:translate(-50%, 12px); background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:12.5px; font-weight:600; opacity:0; pointer-events:none; z-index:99; box-shadow:var(--shadow); transition:opacity var(--tr-dur), transform var(--tr-dur)}
  .toast.show{opacity:1; transform:translate(-50%, 0)}
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:none; backdrop-filter:blur(2px)}

  /* ---------- dashboard stats ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
  .stat{padding:14px 16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--card)}
  .stat .num{font-size:22px; font-weight:700}
  .stat .lbl{font-size:11.5px; color:var(--muted); margin-top:2px}

  /* ---------- IM ---------- */
  .im-layout{display:grid; grid-template-columns:250px 1fr; gap:14px; align-items:start}
  .im-sessions{display:flex; flex-direction:column; gap:6px; max-height:calc(100vh - 260px); overflow-y:auto; padding-right:2px}
  .im-session{padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px; background:var(--bg); transition:all var(--tr-dur); display:flex; justify-content:space-between; align-items:center; gap:6px}
  .im-session:hover{border-color:var(--accent)}
  .im-session.on{background:var(--accent-soft); border-color:var(--accent)}
  .im-session .del{color:var(--muted); background:none; border:0; padding:0 2px; font-size:12px; cursor:pointer}
  .im-session .del:hover{color:var(--danger)}
  .im-session .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .im-thread{display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 340px); min-height:180px; overflow-y:auto; padding:4px}
  .im-msg{max-width:80%; padding:9px 12px; border-radius:12px; font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word}
  .im-msg.user{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:3px}
  .im-msg.assistant{align-self:flex-start; background:var(--bg); border:1px solid var(--border); border-bottom-left-radius:3px}
  .im-msg .meta{font-size:10.5px; opacity:.75; margin-top:3px}
  .im-input-row{display:flex; gap:8px; margin-top:10px}
  .im-input-row input{flex:1}
  @media (max-width:760px){.im-layout{grid-template-columns:1fr}}

  /* ---------- 对话：多会话标签页 ---------- */
  .chat-tabs{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 4px}
  .chat-tab{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; font-size:12px; background:var(--bg); transition:all var(--tr-dur)}
  .chat-tab:hover{border-color:var(--accent)}
  .chat-tab.on{background:var(--accent-soft); border-color:var(--accent)}
  .chat-tab .name{max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chat-tab .del{color:var(--muted); background:none; border:0; padding:0 2px; font-size:12px; cursor:pointer}
  .chat-tab .del:hover{color:var(--danger)}
  .chat-tab.new{color:var(--accent); border-style:dashed}

  .spin{display:inline-block; width:12px; height:12px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:rot .8s linear infinite; vertical-align:-2px}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ---------- plaza (MCP 广场 / 免费模型广场) ---------- */
  .plaza{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px}
  .plaza .item{border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; background:var(--bg)}
  .plaza .item h3{margin:0 0 4px; font-size:13px; font-weight:650}
  .plaza .item p{margin:0 0 8px; font-size:12px; color:var(--muted); min-height:30px; line-height:1.5}
  .plaza .item .url{font-family:var(--mono); font-size:11px; color:var(--muted); word-break:break-all; margin-bottom:8px}
  .plaza .item .hint{font-size:11px; color:var(--warn); margin-bottom:8px; line-height:1.5}
  .plaza .item .row{margin:0}

  @media (max-width:899px){
    #navToggle{display:grid}
    aside{position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%)}
    aside.open{transform:translateX(0); box-shadow:var(--shadow)}
    .backdrop.on{display:block}
    .flow{display:none}
  }
  @media (max-width:600px){
    .content{padding:14px}
    .card{padding:14px}
    .top{padding:10px 12px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important}
  }
  /* 聊天输入区拖拽文件悬停高亮 */
  #chat-wrap.drop{outline:2px dashed var(--accent,#7c5cff);outline-offset:-6px;border-radius:12px}
  .search-in{width:100%;padding:7px 10px;margin-bottom:8px;font-size:12.5px}
</style>
<style>
/* Quiet, spacious conversation surfaces, shared with the native macOS shell. */
.chat-wrap{max-width:840px;box-sizing:border-box;padding:32px 28px 20px;min-height:0}
#chat-hero{gap:20px;padding:48px 0}
#chat-hero .hero-title{font-size:clamp(26px,3vw,36px);font-weight:550;letter-spacing:-1px;line-height:1.35}
#chat-hero::before{content:'COGNITIVE OS';font-size:11px;letter-spacing:3px;color:var(--muted)}

.chat-message{font-size:14px;line-height:1.8;min-width:0;box-sizing:border-box}

.chat-message.bot{align-self:stretch;max-width:100%;padding:2px 0;background:transparent;border:0}
.chat-message{position:relative}
.chat-copy{position:absolute;right:4px;top:-10px;opacity:0;padding:3px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--muted);font-size:11px;cursor:pointer;transition:opacity var(--tr-dur)}
.chat-message:hover .chat-copy,.chat-copy:focus-visible{opacity:1}
.chat-answer{font-family:var(--sans);font-size:14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;margin:18px 0 0}
.run-card{border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--card) 65%,transparent);overflow:hidden}
.run-card summary{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none;font-size:13px}
.run-card summary::-webkit-details-marker{display:none}
.run-card summary::after{content:'⌄';color:var(--muted);font-size:16px;transition:transform 150ms}
.run-card[open] summary::after{transform:rotate(180deg)}
.run-label{flex:1;font-weight:500}.run-time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.run-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.run-dot.active{background:var(--accent);animation:run-breathe 1.8s ease-in-out infinite}.run-dot.error{background:var(--danger)}
.run-steps{list-style:none;margin:0 20px 16px 19px;padding:0 0 0 17px;border-left:1px solid var(--border)}
.run-steps li{padding:9px 0;display:flex;gap:12px;justify-content:space-between;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.run-steps li[data-state=running]{color:var(--fg)}.run-steps li[data-state=failed]{color:var(--danger)}
.run-steps small{font-size:11px;white-space:nowrap;color:var(--muted)}
.pillbar{border:1px solid var(--border);border-radius:22px!important;box-shadow:0 8px 28px #0000000c;padding:12px!important}
.pillbar:focus-within{border-color:var(--accent-ring);box-shadow:0 0 0 3px var(--accent-soft)}
#chat-input{font-size:14px;line-height:1.7;min-height:28px}
#chat-status{padding:6px 4px;min-height:20px!important;color:var(--muted)}
.chat-tabs{gap:8px}.chat-tab{border-radius:20px;padding:6px 12px;background:transparent}.chat-tab.on{border-color:var(--border);background:var(--card);color:var(--fg)}
.top .flow{display:none}button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@keyframes run-breathe{50%{opacity:.35;box-shadow:0 0 0 4px var(--accent-soft)}}
@media(prefers-reduced-motion:reduce){.run-dot.active{animation:none}*{scroll-behavior:auto!important}}
@media(max-width:640px){.chat-wrap{padding:16px 12px}.run-card summary{padding:12px}.run-steps li{flex-wrap:wrap;gap:3px}.chat-message.user{max-width:92%}}

'use strict';
const $ = id => document.getElementById(id);

/* ================= 基础工具 ================= */

async function call(method, path, body) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const r = await fetch(path, {method, signal: controller.signal, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
    const text = await r.text();
    let obj; try { obj = JSON.parse(text); } catch { obj = {raw: text}; }
    return {status: r.status, obj, text};
  } catch (e) {
    return {status: 0, obj: {error: String(e)}, text: ''};
  } finally { clearTimeout(timer); }
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderPre(obj){ return jsonHighlight(obj); }

function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(() => toast('已复制'), () => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch(e) { toast('复制失败'); }
  ta.remove();
}
function copyPre(id){ const el = $(id); if(el) copyText(el.textContent); }

/* ================= JSON 语法高亮 ================= */

const JSON_RX = /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;

function jsonHighlight(obj){
  const s = JSON.stringify(obj, null, 2);
  let out = '', last = 0, m;
  JSON_RX.lastIndex = 0;
  while ((m = JSON_RX.exec(s))) {
    out += esc(s.slice(last, m.index));
    const tok = m[0];
    if (/:$/.test(tok)) {
      out += '<span class="k">' + esc(tok.slice(0, -1)) + '</span><span class="p">:</span>';
    } else if (tok[0] === '"') {
      out += '<span class="s">' + esc(tok) + '</span>';
    } else if (tok === 'true' || tok === 'false') {
      out += '<span class="b">' + tok + '</span>';
    } else if (tok === 'null') {
      out += '<span class="n">null</span>';
    } else {
      out += '<span class="num">' + tok + '</span>';
    }
    last = JSON_RX.lastIndex;
  }
  out += esc(s.slice(last));
  return '<div class="json">' + out + '</div>';
}

function renderJSON(obj, el){
  if(!el) return;
  const empty = obj == null ||
    (Array.isArray(obj) && !obj.length) ||
    (typeof obj === 'object' && !Array.isArray(obj) && !Object.keys(obj).length);
  el.innerHTML = empty
    ? '<div class="json"><span class="empty">（暂无数据）</span></div>'
    : jsonHighlight(obj);
}

async function loadCron(){
  const r = await call('GET', '/v1/cron');
  const list = (r.obj && Array.isArray(r.obj)) ? r.obj : [];
  const box = $('cron-list'); if(!box) return;
  if(!list.length){ box.innerHTML = '<div class="hint">暂无定时任务</div>'; return; }
  /* issue #13: 从任务 journal 拉最近结果，按 last_id 关联展示 */
  let journal = [];
  const jr = await call('GET', '/v1/tasks/journal?limit=200');
  if(Array.isArray(jr.obj)) journal = jr.obj;
  const byId = {};
  journal.forEach(t => { byId[t.id] = t; });
  box.innerHTML = '';
  list.forEach(j => {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.cssText = 'align-items:center;border-bottom:1px solid var(--border);padding:7px 2px';
    const kind = j.every_sec > 0 ? ('每 ' + j.every_sec + ' 秒') : ('每天 ' + (j.at || ''));
    const next = j.next_run_ms ? new Date(j.next_run_ms).toLocaleString() : '—';
    const lastRun = j.last_run_ms ? new Date(j.last_run_ms).toLocaleString() : '';
    const rec = j.last_id ? byId[j.last_id] : null;
    let lastLine = lastRun ? ('上次 ' + esc(lastRun)) : '未运行';
    if(rec){
      const out = (rec.output || '').replace(/\s+/g, ' ').trim();
      lastLine += ' · <span style="color:' + (rec.status === 'DONE' ? 'var(--ok,#4ade80)' : 'var(--danger,#f87171)') + '">' +
                  esc(rec.status || '?') + '</span>';
      if(out) lastLine += '<div class="muted" style="font-size:11.5px;white-space:normal;margin-top:2px" title="' + esc(rec.output || '') + '">结果：' + esc(out.slice(0, 200)) + (out.length > 200 ? '…' : '') + '</div>';
    }
    row.innerHTML =
      '<div style="flex:1;min-width:0"><b>' + esc(j.name || ('#' + j.id)) + '</b>' +
      '<span class="muted"> · ' + esc(kind) + (j.enabled ? '' : ' · 已停用') + '</span>' +
      '<div class="muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(j.prompt) + '">' + esc(j.prompt) + '</div>' +
      '<div class="muted" style="font-size:11px">会话 ' + esc(j.session || 'cron') + ' · 下次 ' + esc(next) + ' · <span>' + lastLine + '</span></div></div>';
    const tgl = document.createElement('button');
    tgl.className = 'sec sm'; tgl.textContent = j.enabled ? '停用' : '启用';
    tgl.onclick = async () => { await call('POST', '/v1/cron/' + j.id + '/toggle', {enabled: !j.enabled}); loadCron(); };
    const del = document.createElement('button');
    del.className = 'sec sm'; del.textContent = '删除';
    del.onclick = async () => { if(!confirm('删除定时任务 ' + (j.name || j.id) + '?')) return; await call('DELETE', '/v1/cron/' + j.id); loadCron(); };
    row.appendChild(tgl); row.appendChild(del);
    box.appendChild(row);
  });
}

async function cronAdd(){
  const st = $('cron-stat'); if(st) st.textContent = '';
  const kind = $('cron-kind').value;
  const body = {
    name: $('cron-name').value.trim(),
    prompt: $('cron-prompt').value.trim(),
    session: $('cron-session').value.trim() || undefined
  };
  if(!body.prompt){ if(st) st.textContent = 'need prompt'; return; }
  if(kind === 'every'){
    const s = parseInt($('cron-every').value, 10);
    if(!s || s < 30){ if(st) st.textContent = '间隔至少 30 秒'; return; }
    body.every_sec = s;
  } else {
    const at = $('cron-at').value;
    if(!at){ if(st) st.textContent = 'need HH:MM'; return; }
    body.at = at;
  }
  const r = await call('POST', '/v1/cron', body);
  if(r.status < 300){
    $('cron-name').value = ''; $('cron-prompt').value = '';
    if(st) st.textContent = '已创建';
    loadCron();
  } else if(st) st.textContent = 'error: ' + ((r.obj && r.obj.error) || ('HTTP ' + r.status));
}

/* fetch one fetchers[] entry into its <pre> (used by panels that need both
 * a raw endpoint dump and a custom-rendered section) */
async function loadFetcher(key){
  const f = fetchers[key]; if(!f) return;
  const r = await call('GET', f.path);
  const el = $(f.out); if(el) renderJSON(r.obj, el);
}

async function load(panel){
  if(panel === 'models') return loadModels();
  if(panel === 'dashboard') return loadDashboard();
  if(panel === 'im') return renderIm();
  if(panel === 'agents') return (loadAgents(), loadFlow(), loadFlowTasks());
  if(panel === 'mcp') return loadMcp();
  if(panel === 'skills') return (loadSkillsMarket(), loadSkillsCatalog());
  if(panel === 'plugins') return (loadFetcher('plugins'), loadPluginMarket());
  if(panel === 'snapshots') return loadSnapshots();
  if(panel === 'chat') return loadChat();
  if(panel === 'cron') return loadCron();
  if(panel === 'policy') return loadPolicy();
  if(panel === 'flow') return (loadFlow(), loadFlowTasks());
  if(panel === 'metrics'){
    const r = await call('GET', '/metrics');
    const el = $('metrics-out'); if(el) el.textContent = r.text;
    return;
  }
  return loadFetcher(panel);
}

/* 任务历史（journal/checkpoint）：列出最近的任务终态记录，支持一键恢复 */
async function loadJournal(){
  const el = $('journal-list'); if(!el) return;
  const r = await call('GET', '/v1/tasks/journal?limit=50');
  const arr = (r.obj && Array.isArray(r.obj)) ? r.obj : [];
  if(!arr.length){ el.textContent = '暂无任务历史'; return; }
  el.classList.remove('hint');
  el.innerHTML = '';
  const COL = {DONE:'var(--ok,#4ade80)',FAILED:'var(--danger,#f87171)',CANCELLED:'var(--muted)',TIMEOUT:'var(--warn,#fbbf24)'};
  arr.slice().reverse().forEach(t => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:12.5px';
    const st = document.createElement('span');
    st.style.cssText = 'color:' + (COL[t.status] || 'var(--muted)') + ';font-weight:600;min-width:72px';
    st.textContent = t.status || '?';
    const txt = document.createElement('span');
    txt.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    txt.textContent = '#' + t.id + ' ' + (t.input || '');
    txt.title = t.input || '';
    const when = document.createElement('span');
    when.className = 'muted';
    when.style.fontSize = '11px';
    when.textContent = t.ts ? new Date(t.ts).toLocaleString() : '';
    row.appendChild(st); row.appendChild(txt); row.appendChild(when);
    const btn = document.createElement('button');
    btn.className = 'sec sm'; btn.textContent = '恢复';
    btn.onclick = async () => {
      const rr = await call('POST', '/v1/tasks/' + t.id + '/resume', {});
      if(rr.obj && rr.obj.id){ toast('已恢复为新任务 #' + rr.obj.id); loadJournal(); }
      else toast('恢复失败：' + (rr.obj && rr.obj.error || rr.status));
    };
    row.appendChild(btn);
    el.appendChild(row);
  });
}

async function loadSnapshotCfg(){
  const r = await call('GET', '/v1/config/snapshot');
  const el = $('snap-max'); if(!el) return;
  const v = (r.obj && typeof r.obj.max_file === 'number' && r.obj.max_file >= 0) ? r.obj.max_file : 67108864;
  el.value = v === 0 ? 0 : Math.round(v / 1048576);
  const st = $('snap-max-msg'); if(st) st.textContent = '';
}

async function saveSnapshotCfg(){
  const el = $('snap-max'); if(!el) return;
  const st = $('snap-max-msg');
  const mb = parseInt(el.value, 10);
  if(isNaN(mb) || mb < 0){ if(st) st.textContent = '请输入 ≥ 0 的整数（0 = 不限制）'; return; }
  const r = await call('POST', '/v1/config/snapshot', {max_file: mb * 1048576});
  if(st) st.textContent = (r.status === 200 && r.obj && r.obj.ok) ? '已保存' : ('失败: ' + (r.text || ('HTTP ' + r.status)).slice(0, 80));
}

/* Fill the agent-creation model dropdown from the registered routes

async function fillAgentModelSelect(){

  const r = await call('GET', '/v1/routes');
  const routes = Array.isArray(r.obj) ? r.obj : [];
  let html = '<option value="">（当前激活模型）</option>';
  routes.forEach(x => {
    const val = (x.provider || '') + '|' + (x.model || '');
    const label = (x.name || x.model || 'route') + '（' + (x.provider || '?') + ' / ' + (x.model || '?') + '）';
    html += '<option value="' + esc(val) + '">' + esc(label) + '</option>';
  });
  sel.innerHTML = html;
  const has = Array.from(sel.options).some(o => o.value === keep);

async function loadAgents(){
  renderAgentPresets();
  const r = await call('GET', '/v1/agents');
  const box = $('agents-out2');
  if(!box) return;
  const obj = (r.obj && typeof r.obj === 'object') ? r.obj : {};
  AGENTS = Array.isArray(obj.agents) ? obj.agents : [];
  /* 模型选项来自路由表：每个 agent 可单独换模型（PUT /v1/agents/<name>） */
  const rr = await call('GET', '/v1/routes');
  const routes = Array.isArray(rr.obj) ? rr.obj : [];
  const modelOptions = (cur) => {
    let h = '<option value="">（当前激活模型）</option>';
    let found = false;
    routes.forEach(x => {
      const v = (x.provider || '') + '|' + (x.model || '');
      const label = (x.name || x.model || 'route') + '（' + (x.provider || '?') + ' / ' + (x.model || '?') + '）';
      h += '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(label) + '</option>';
      if(v === cur) found = true;
    });
    /* 存储的模型已被删除时保留显示，避免静默回退 */
    if(cur && cur !== '|' && !found)
      h += '<option value="' + esc(cur) + '" selected>' + esc(cur.replace('|', ' / ')) + '（已删除的路由）</option>';
    return h;
  };
  let html = '<div class="table-wrap"><table><thead><tr><th>Agent</th><th>Role</th><th>Model</th><th>操作</th></tr></thead><tbody>';
  if(!AGENTS.length) html += '<tr><td colspan="4" class="muted">（暂无 agent，先创建一个）</td></tr>';
  AGENTS.forEach(a => {
    const cur = (a.provider || '') + '|' + (a.model || '');
    const hasModel = (a.provider || a.model) ? true : false;
    html += '<tr><td>' + esc(a.name || '') + '</td><td>' + esc(a.role || '') + '</td>' +
      '<td><select class="agent-model-sel" style="max-width:240px">' + modelOptions(hasModel ? cur : '') + '</select></td>' +
      '<td><button class="sec sm" onclick="agentSetModel(\'' + esc(a.name || '') + '\', this)">保存模型</button> ' +
      '<button class="sec sm danger" onclick="agentDelete(\'' + esc(a.name || '') + '\')">删除</button></td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="hint" style="margin-top:8px">共享黑板 facts:</div><pre>' + esc(JSON.stringify(obj.facts || {}, null, 2)) + '</pre>';
  box.innerHTML = html;
  fillAgentModelSelect();
}

/* 修改指定 agent 使用的模型（PUT /v1/agents/<name>，空 = 回退当前激活模型） */
async function agentSetModel(name, btn){
  const tr = btn && btn.closest ? btn.closest('tr') : null;
  const sel = tr ? tr.querySelector('select.agent-model-sel') : null;
  if(!sel){ toast('未找到模型选择框'); return; }
  const val = sel.value || '';
  const i = val.indexOf('|');
  const provider = i >= 0 ? val.slice(0, i) : '';
  const model = i >= 0 ? val.slice(i + 1) : '';
  const r = await call('PUT', '/v1/agents/' + encodeURIComponent(name), {provider, model});
  if(r.status === 200) toast('已更新 ' + name + ' 的模型');
  else toast('更新失败: ' + ((r.obj && r.obj.error) || r.text || ('HTTP ' + r.status)));
}

function agentMatchPresets(text){
  const t = (text || '').toLowerCase();
  const hits = AGENT_PRESETS.filter(p => p.kw.some(k => t.includes(k.toLowerCase())));
  return hits.length ? hits : [AGENT_PRESETS.find(p => p.key === 'coder')];
}

async function agentTeamCompose(){
  const task = $('agent-team-task').value.trim();
  const st = $('agent-stat');
  if(!task){ if(st) st.textContent = '先输入任务描述再智能组队'; return; }
  const picks = agentMatchPresets(task);
  const have = new Set(AGENTS.map(a => a.name));
  const todo = picks.filter(p => !have.has(p.name));
  const skipped = picks.filter(p => have.has(p.name)).map(p => p.name);
  if(skipped.length) toast('已跳过已存在的 agent：' + skipped.join(', '));
  if(!todo.length){ if(st) st.textContent = '匹配到的角色均已存在'; return; }
  if(st) st.textContent = '创建中… ' + todo.map(p => p.name).join(', ');
  for(const p of todo){
    const r = await call('POST', '/v1/agents', {name: p.name, role: p.role});
    if(r.status >= 300){
      if(st) st.textContent = '创建 ' + p.name + ' 失败: ' + ((r.obj && r.obj.error) || r.status);
      return;
    }
  }
  if(st) st.textContent = '✔ 智能组队完成（' + todo.length + ' 个 agent）';
  toast('🎯 按任务匹配创建：' + todo.map(p => p.label).join(' / '));
  loadAgents();
}

  const body = {name, role};
  /* dropdown value is "provider|model" ("" = current active model) */
  const pick = $('agent-model').value;
  if(pick){
    const sep = pick.indexOf('|');
    const provider = sep >= 0 ? pick.slice(0, sep) : pick;
    const model = sep >= 0 ? pick.slice(sep + 1) : '';
    if(provider) body.provider = provider;
    if(model) body.model = model;
  }
  call('POST', '/v1/agents', body).then(r => {

  });
}

/* 按搜索框关键字过滤渲染（名称/描述/传输类型） */
function renderMcpPlaza(){
  const box = $('mcp-plaza');
  if(!box) return;
  const q = (($('mcp-search') || {}).value || '').trim().toLowerCase();
  const list = !q ? MCP_PLAZA : MCP_PLAZA.filter(m =>
    [m.name, m.description, m.transport, m.url, m.command, m.repo]
      .some(f => f && String(f).toLowerCase().includes(q)));
  if(!MCP_PLAZA.length){ box.innerHTML = '<span class="muted" style="font-size:12px">（目录为空）</span>'; return; }
  if(!list.length){ box.innerHTML = '<span class="muted" style="font-size:12px">（无匹配 "' + esc(q) + '" 的 MCP 服务器）</span>'; return; }
  box.innerHTML = list.map((m) => {
    const i = MCP_PLAZA.indexOf(m);
    const isRef = m.transport === 'reference';
    const target = isRef ? esc(m.repo || '')
      : esc(m.transport === 'stdio' ? ((m.command || '') + ' ' + (m.args || '')) : (m.url || ''));
    let btns = '';
    if(isRef){
      btns = '<a class="sec sm" href="' + esc(m.repo) + '" target="_blank" rel="noopener">查看仓库</a>';
    } else {
      btns = '<button class="sec sm" onclick="mcpPlazaTest(' + i + ')">测试</button> ' +

      '<div class="hint">' + (isRef ? '' : (m.needs_local ? '需本地运行 · ' : '')) + esc(m.key_hint || '') + '</div>' +
      btns + '</div>';

async function mcpPlazaTest(i){
  const m = MCP_PLAZA[i]; if(!m) return;
  if(m.transport === 'reference'){ toast('参考仓库条目无需测试，请到仓库查看'); return; }
  toast('测试 MCP 连接 ' + m.id + ' …');
  const body = {transport: m.transport || 'http'};
  if(body.transport === 'stdio'){ body.command = m.command || ''; body.args = m.args || ''; }
  else body.url = m.url;
  if(m.needs_token && !body.token){
    const tok = prompt('该 MCP 服务器需要凭据，请输入 ' + (m.key_hint || 'token') + '（留空则不带 token 测试）：');
    if(tok && tok.trim()) body.token = tok.trim();
  }
  const r = await call('POST', '/v1/mcp/test', body);
  if(r.obj && r.obj.ok) toast('✔ 连接成功：' + (r.obj.count || 0) + ' 个工具');
  else toast('✘ 测试失败: ' + ((r.obj && r.obj.error) || ('HTTP ' + r.status)));
}

async function mcpPlazaUse(i){
  const m = MCP_PLAZA[i]; if(!m) return;
  toast('添加 MCP 连接 ' + m.id + ' …');
  const body = {name: m.id, transport: m.transport || 'http'};
  if(m.transport === 'stdio'){
    body.command = m.command || '';
    body.args = m.args || '';
    if(!body.command){ toast('该条目缺少 stdio 命令'); return; }
  } else {
    body.url = m.url;
  }
  if(m.token && m.token_hint) body.token = m.token;
  if(m.needs_token && !body.token){
    const tok = prompt('该 MCP 服务器需要凭据，请输入 ' + (m.key_hint || 'token') + '：');
    if(!tok){ toast('已取消（未填 token）'); return; }
    body.token = tok.trim();
    if(!body.token){ toast('已取消（未填 token）'); return; }
  }
  const r = await call('POST', '/v1/mcp', body);
  if(r.status < 300) toast('✔ 已添加连接 ' + m.id);
  else toast('添加失败: ' + ((r.obj && r.obj.error) || ('HTTP ' + r.status)));
  loadMcp();
}

function mcpAdd(){
  const name = $('mcp-name').value.trim();
  const transport = $('mcp-transport') ? $('mcp-transport').value : 'http';
  const url = $('mcp-url').value.trim();
  const command = $('mcp-command') ? $('mcp-command').value.trim() : '';
  const args = $('mcp-args') ? $('mcp-args').value.trim() : '';
  const token = $('mcp-token').value.trim();
  const st = $('mcp-stat');
  if(!name){ if(st) st.textContent = '需要 name'; return; }
  if(transport === 'http' && !url){ if(st) st.textContent = 'http 传输需要 url'; return; }
  if(transport === 'stdio' && !command){ if(st) st.textContent = 'stdio 传输需要 command'; return; }
  const body = {name, transport};
  if(transport === 'http') body.url = url; else { body.command = command; if(args) body.args = args; }
  if(token) body.token = token;
  call('POST', '/v1/mcp', body).then(r => {
    if(st) st.textContent = (r.status < 300) ? '✔ 已添加' : ((r.obj && r.obj.error) ? 'error: ' + r.obj.error : 'error ' + r.status);
    if(r.status < 300){ $('mcp-name').value = ''; $('mcp-url').value = ''; $('mcp-command').value = ''; $('mcp-args').value = ''; $('mcp-token').value = ''; loadMcp(); }
  });
}

  if(r.obj && r.obj.ok) toast('✔ ' + c.name + ' 连接成功：' + (r.obj.count || 0) + ' 个工具');

async function loadDashboard(){
  const [ag, mem, plg, im, llm, usg] = await Promise.all([
    call('GET', '/v1/agents'),
    call('GET', '/v1/memory'),
    call('GET', '/v1/plugins'),
    call('GET', '/v1/im/sessions'),
    call('GET', '/v1/config/llm'),
    call('GET', '/v1/usage'),
  ]);
  const st = $('dashStats');
  if(st){
    const agents  = Array.isArray(ag.obj) ? ag.obj.length : (ag.obj && ag.obj.agents ? ag.obj.agents.length : 0);
    const wmem    = (mem.obj && Array.isArray(mem.obj.working)) ? mem.obj.working.length : 0;
    const plugins = (plg.obj && plg.obj.plugins && Array.isArray(plg.obj.plugins)) ? plg.obj.plugins.length
                  : (Array.isArray(plg.obj) ? plg.obj.length : 0);
    const ims     = (im.obj && im.obj.total_messages) ? im.obj.total_messages : 0;
    const provider = (llm.obj && llm.obj.provider) ? llm.obj.provider : '?';
    const tot = usg.obj && usg.obj.total ? usg.obj.total : {prompt:0, completion:0};
    const cells = st.querySelectorAll('.stat .num');
    if(cells.length >= 7){
      cells[0].textContent = '0.5.0';
      cells[1].textContent = provider;
      cells[2].textContent = agents;
      cells[3].textContent = wmem;
      cells[4].textContent = plugins;
      cells[5].textContent = ims;
      cells[6].textContent = (tot.prompt + tot.completion).toLocaleString();
      cells[6].title = '输入 ' + (tot.prompt || 0).toLocaleString() + ' / 输出 ' + (tot.completion || 0).toLocaleString();
    }
  }
  /* 按模型的 token 用量明细（/v1/usage：reasoning 每轮把增量记入账本） */
  const tk = $('dash-tokens');
  if(tk){
    const models = (usg.obj && usg.obj.models) ? usg.obj.models : {};
    const keys = Object.keys(models);
    tk.innerHTML = keys.length
      ? keys.map(k => {
          const m = models[k];
          return '<div class="item"><b>' + esc(k) + '</b>' +
            '<div class="hint">输入 ' + (m.prompt || 0).toLocaleString() + ' · 输出 ' + (m.completion || 0).toLocaleString() +
            ' · 调用 ' + (m.calls || 0) + ' 次</div></div>';
        }).join('')
      : '<span class="muted">（尚无用量记录 — 完成一次对话后显示）</span>';
  }
  const el = $('dash-out');
  if(el){
    const payload = {
      agents: ag.obj, memory: mem.obj, plugins: plg.obj, im: im.obj
    };
    renderJSON(payload, el);
  }
}

/* GitHub 全网在线搜索：实时调 GitHub search API 找技能仓库（后端代理） */
let GH_SEARCH_LAST = [];

async function githubSearchOnline(){
  const box = $('gh-online-catalog'); if(!box) return;
  const q = skillQ();
  if(!q){ box.innerHTML = '<span class="muted">（输入关键字在线搜索 GitHub 技能仓库）</span>'; return; }
  box.innerHTML = '<span class="muted">🌐 正在 GitHub 全网搜索「' + esc(q) + '」…</span>';
  /* issue #20: 后端把搜索放后台线程，这里轮询直到结果就绪，
   * 不再长时间占住单线程服务器把其他面板全部卡成「加载中」 */
  let r = null;
  for(let i = 0; i < 60; i++){
    r = await call('GET', '/v1/catalog/github-search?q=' + encodeURIComponent(q));
    if(r.obj && r.obj.pending){ await new Promise(res => setTimeout(res, 700)); continue; }
    break;
  }
  if(!r || (r.obj && r.obj.pending)){ box.innerHTML = '<span class="muted">（搜索超时，请重试）</span>'; return; }
  if(r.status >= 400){
    box.innerHTML = '<span class="muted">（搜索失败：' + esc((r.obj && r.obj.error) || ('HTTP ' + r.status)) + '）</span>';
    return;
  }
  const list = Array.isArray(r.obj) ? r.obj : [];
  GH_SEARCH_LAST = list;
  if(!list.length){
    box.innerHTML = '<span class="muted">（GitHub 全网无匹配或搜索失败，可 <a href="https://github.com/search?q=' +
      encodeURIComponent(q) + '&type=repositories" target="_blank" rel="noopener">去 GitHub 站内搜</a>）</span>';
    return;
  }
  box.innerHTML = list.map((x, i) =>
    '<div class="item"><b><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.repo) + '</a></b> ' +
    '<span class="muted">⭐ ' + (x.stars || 0) + '</span>' +
    '<button class="sec sm" onclick="ghInstall(' + i + ')">安装</button>' +
    '<div class="hint">' + esc(x.description || '') + '</div></div>').join('');
}

/* SkillHub（skillhub.cn）在线技能：列表实时来自 api.skillhub.cn，安装时后端拉取 SKILL.md 原文 */
let SKH_SKILLS = [];

async function loadSkillhubList(){
  const box = $('skh-skill-catalog'); if(!box) return;
  const q = skillQ();
  box.innerHTML = q ? '<span class="muted">🔍 正在 SkillHub 市场全量搜索「' + esc(q) + '」…</span>'
                    : '<span class="muted">加载中…（访问 api.skillhub.cn）</span>';
  /* issue #20: 后台线程 + 轮询，搜索期间不再卡住整个 UI */
  let r = null;
  for(let i = 0; i < 60; i++){
    r = await call('GET', '/v1/catalog/skillhub' + (q ? '?q=' + encodeURIComponent(q) : ''));
    if(r.obj && r.obj.pending){ await new Promise(res => setTimeout(res, 700)); continue; }
    break;
  }
  if(!r || (r.obj && r.obj.pending)){ box.innerHTML = '<span class="muted">（加载超时，请重试）</span>'; return; }
  if(r.status >= 400){
    box.innerHTML = '<span class="muted">（加载失败：' + esc((r.obj && r.obj.error) || ('HTTP ' + r.status)) + '）</span>';
    return;
  }
  SKH_SKILLS = Array.isArray(r.obj) ? r.obj : [];
  SKH_Q_LAST = q;
  renderSkhSkills();
}

function renderSkhSkills(){
  const box = $('skh-skill-catalog'); if(!box) return;
  if(!SKH_SKILLS.length){
    box.innerHTML = (skillQ() && skillQ() === SKH_Q_LAST)
      ? '<span class="muted">（市场全量搜索无匹配，换个关键字试试）</span>'
      : '<span class="muted">（加载失败：无法从 skillhub.cn 获取列表，检查网络）</span>';
    return;
  }
  const list = SKH_SKILLS.filter(x => skillHit(x, [x.name, x.id, x.description]));
  if(!list.length){ box.innerHTML = '<span class="muted">（无匹配技能）</span>'; return; }
  box.innerHTML = list.map((x) => {
    const i = SKH_SKILLS.indexOf(x);
    return '<div class="item"><b>' + esc(x.name || x.id) + '</b> <span class="muted">' + (x.skill_count || 0) + ' 技能</span>' +
      '<div class="hint">' + esc(x.description || '') + '</div>' +
      '<a class="sec sm" href="' + esc(x.source) + '" target="_blank" rel="noopener">详情</a> ' +
      '<button class="sec sm" onclick="skillhubInstall(' + i + ')">安装</button></div>';
  }).join('');
}

async function loadChannels(){

function imSelect(id){
  IM_ACTIVE = id;
  document.querySelectorAll('.im-session').forEach(s => s.classList.toggle('on', s.dataset.id === String(id)));
  renderImThread();
}

function appendImMessage(m){
  const t = $('im-thread');
  if(!t) return;
  const d = new Date(m.ts_ms || Date.now());
  const time = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  const isMine = (m.role === 'user') && (!m.sender || m.sender === 'me');
  const div = document.createElement('div');
  div.className = 'im-msg ' + (isMine ? 'user' : 'assistant');
  div.textContent = m.content || '';
  const meta = document.createElement('div');
  meta.className = 'meta';
  const who = m.sender || (m.role === 'user' ? 'user' : 'assistant');
  meta.textContent = who + ' · ' + time;
  div.appendChild(meta);
  t.appendChild(div);
  t.scrollTop = t.scrollHeight;
}

async function renderImThread(){
  const t = $('im-thread');
  if(!t) return;
  if(IM_ACTIVE === null){
    t.innerHTML = '<span class="muted" style="font-size:12px">选择一个会话开始聊天</span>';
    return;
  }
  t.innerHTML = '<span class="muted"><span class="spin"></span> 加载中…</span>';
  const r = await call('GET', '/v1/im/sessions/' + IM_ACTIVE + '/messages');
  t.innerHTML = '';
  if(Array.isArray(r.obj)){
    r.obj.forEach(m => appendImMessage(m));
  }
}

async function renderIm(){
  const list = $('im-sessions');
  if(!list) return;
  await loadChannels();
  const sel = $('im-channel');
  if(sel){
    sel.innerHTML = '<option value="">无关联渠道</option>';
    IM_CHANNELS.forEach(c => {
      const o = document.createElement('option'); o.value = c.name; o.textContent = c.name + ' (' + c.type + ')';
      sel.appendChild(o);
    });
  }
  const g = $('im-group');
  if(g && !g.dataset.bound){
    g.dataset.bound = '1';
    g.addEventListener('change', () => { const el = $('im-members'); if(el) el.hidden = !g.checked; });
  }
  const r = await call('GET', '/v1/im/sessions');
  const sessions = (r.obj && Array.isArray(r.obj.sessions)) ? r.obj.sessions : [];
  list.innerHTML = '';
  if(!sessions.length){
    list.innerHTML = '<span class="muted" style="font-size:12px">暂无会话，创建第一个吧</span>';
    return;
  }
  sessions.forEach(s => {
    const isGroup = s.kind === 'group';
    const div = document.createElement('div');
    div.className = 'im-session' + (s.id === IM_ACTIVE ? ' on' : '');
    div.dataset.id = s.id;
    div.onclick = () => imSelect(s.id);
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = (s.name || ('#' + s.id)) + ' · ' + (s.messages || 0);
    if(isGroup) name.textContent += ' · ' + ((s.members || []).length) + '人';
    const badge = document.createElement('span');
    badge.className = 'badge ' + (isGroup ? 'badge-ok' : 'badge-warn');
    badge.textContent = isGroup ? '群' : '单';
    if(s.channel){
      const ch = document.createElement('span');
      ch.className = 'badge badge-accent';
      ch.textContent = '渠道:' + s.channel;
      ch.title = '关联外部渠道';
      name.appendChild(ch);
    }
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '删除会话';
    del.onclick = (e) => { e.stopPropagation(); imDelete(s.id); };
    const left = document.createElement('span');
    left.style.cssText = 'display:flex;align-items:center;gap:6px;min-width:0;flex:1';
    left.appendChild(badge);
    left.appendChild(name);
    div.appendChild(left);
    div.appendChild(del);
    list.appendChild(div);
  });
  renderChannels();
  renderImThread();

function imSend(){
  const input = $('im-input');
  let content = input.value.trim();
  if(!content || IM_ACTIVE === null) return;
  let sender = 'me';
  const m = content.match(/^@(\S+)\s+/);
  if(m){ sender = m[1]; content = content.slice(m[0].length); }
  if(!content) return;
  input.value = '';
  const payload = {type:'im.send', session_id: IM_ACTIVE, content, sender};
  if(WS && WS.readyState === WebSocket.OPEN){
    WS.send(JSON.stringify(payload));
  } else {
    call('POST', '/v1/im/sessions/' + IM_ACTIVE + '/messages', {role:'user', content, sender}).then(r => {
      if(r.obj && r.obj.ok) renderImThread();
    });
  }
}

    '<b>' + esc(h.session_name || ('#' + h.session_id)) + '</b><span>' + esc(h.content) + '</span></button>'
  ).join('') + '</div>';

/* ================= WebSocket 实时推送 ================= */

function wsConnect(){
  try {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    WS = new WebSocket(proto + '://' + location.host + '/ws');
    WS.onmessage = (e) => {
      try {
        const m = JSON.parse(e.data);
        if(m.type === 'im.message'){
          if(current === 'im' && IM_ACTIVE === m.session_id){
            appendImMessage(m);
          } else {
            toast('📩 新消息: ' + ((m.role === 'user') ? '用户' : '助手'));
          }
        } else if(m.type === 'event' && m.source === 'flow'){
          const el = $('flow-out');
          if(el && m.payload){
            const p = m.payload;
            let line = '';
            if(p.stage === 'execute') line = '→ [' + (p.node || '') + ':' + (p.agent || '') + '] ' + (p.detail || '');
            else if(p.stage === 'done') line = '✓ [' + (p.node || '') + ':' + (p.agent || '') + '] ' + (p.detail || '完成');
            if(line) el.textContent += (el.textContent ? '\n' : '') + line;
          }
        } else if(m.type === 'event' && m.source === 'task.progress' && m.payload){
          const p = m.payload;
          chatApplyProgress(p.session_id, p.task_id, p);
        }
      } catch(err) { /* ignore non-JSON */ }
    };
    WS.onclose = () => { setTimeout(wsConnect, 3000); };
    WS.onerror = () => { try { WS.close(); } catch(e) {} };
  } catch(e) { /* ws unsupported */ }
}

/* ================= 对话（连续多轮聊天 + 多会话标签页） ================= */

let CHAT_SESSION = 'default';   // 当前激活会话 id（"default" = 共享默认会话）
let CHAT_NEW_SESSION = false;   // 新会话尚未发出首条消息（后端还没有该 id）
let CHAT_MSGS = [];             // 当前会话气泡的本地镜像 [{role,text,pending,el}]
// switchPanel 用 innerHTML 重绘面板，气泡若只活在 DOM 里，切页即丢；
// 轮询循环持有的节点也会脱离文档导致任务结果更新到空中。所有渲染都从
// CHAT_MSGS 恢复，进行中的回复以 pending 标记，切回面板后继续显示。
// CHAT_CACHE: 每会话消息缓存（sessionId → msgs），切会话/切页时先回放缓存
// 再等服务端历史，避免闪烁与清空。
const CHAT_CACHE = {};
function chatCacheStore(){ CHAT_CACHE[CHAT_SESSION] = CHAT_MSGS; }

function chatRedraw(){
  const box = $('chat-box'); if(!box) return;
  box.innerHTML = '';
  CHAT_MSGS.forEach(m => { m.el = chatAddBubble(m.role, m.text, false); renderChatEntry(m); });
  updateChatHero();
  chatScroll();
}

async function loadChat(){
  const box = $('chat-box'); if(!box) return;
  await loadChatSessions();
  await chatLoadHistory();
  loadUploads();
  fillChatModelSelect();
  chatInitDrop(); /* 粘贴图片 / 拖拽文件支持 */
  chatAttachRender();
  chatGateCheck(); /* 进入新聊天先检查模型配置，未配置则禁用发送 */
  /* issue #22: 切回对话面板时恢复本会话运行中任务的「取消」按钮与状态行 */
  syncChatTaskId();
  if(chatIsBusy()){
    const st = $('chat-status');
    if(st && !st.textContent) st.textContent = '任务执行中…';
  }
}

/* 对话侧模型配置（issue #11）：下拉列出 Model routes，选中即把当前激活
 * LLM 切到该路由（POST /v1/config/llm），聊天中途可随时换模型 */
let CHAT_ROUTES = [];
async function fillChatModelSelect(){
  const sel = $('chat-model'); if(!sel) return;
  const keep = sel.value;
  const r = await call('GET', '/v1/routes');
  CHAT_ROUTES = Array.isArray(r.obj) ? r.obj : [];
  const cur = await call('GET', '/v1/config/llm');
  const curProv = (cur.obj && cur.obj.provider) || '';
  const curModel = (cur.obj && cur.obj.model) || '';
  let html = '';
  let matched = false;
  CHAT_ROUTES.forEach(x => {
    const val = (x.provider || '') + '|' + (x.model || '');
    const isCur = curProv && curProv === x.provider && (curModel || '') === (x.model || '');
    if(isCur) matched = true;
    html += '<option value="' + esc(val) + '">' + esc((x.name || x.model || 'route') + '（' + (x.provider || '?') +
            (x.model ? ' / ' + x.model : '') + (isCur ? ' · 当前' : '') + '）') + '</option>';
  });
  if(!matched && curProv)
    html = '<option value="@cur">（当前：' + esc(curProv + (curModel ? ' / ' + curModel : '')) + '）</option>' + html;
  sel.innerHTML = html;
  sel.value = keep && Array.from(sel.options).some(o => o.value === keep) ? keep : (matched ? curProv + '|' + curModel : '@cur');
}

async function chatModelSwitch(){
  const sel = $('chat-model'); if(!sel || !sel.value || sel.value === '@cur') return;
  const hit = CHAT_ROUTES.find(x => ((x.provider || '') + '|' + (x.model || '')) === sel.value);
  if(!hit){ toast('路由不存在'); return; }
  const body = {provider: hit.provider};
  if(hit.base_url) body.base_url = hit.base_url;
  if(hit.model) body.model = hit.model;
  if(hit.api_key) body.api_key = hit.api_key;
  const r = await call('POST', '/v1/config/llm', body);
  if(r.status < 300){
    toast('已切换对话模型：' + (hit.model || hit.provider));
    fillChatModelSelect();
  } else {
    toast('切换失败：' + (r.obj && r.obj.error || r.status));
  }
}

/* 后端返回裸数组 [{id,title,turns,created_ms,total_ms,last_active_ms,shared_memory,task}] */
function chatSessionList(r){
  const o = r && r.obj;
  if(Array.isArray(o)) return o;
  if(o && Array.isArray(o.sessions)) return o.sessions;
  return [];
}

async function loadChatSessions(){
  const r = await call('GET', '/v1/chat/sessions');
  renderChatTabs(chatSessionList(r));
}

/* 会话时长格式化（total_ms → 「1分23秒」） */
function fmtDur(ms){
  if(!ms || ms < 1000) return '';
  const s = Math.floor(ms / 1000);
  if(s < 60) return s + '秒';
  return Math.floor(s / 60) + '分' + (s % 60) + '秒';
}

/* 最近一次从服务端拿到的会话列表。chatNewSession / chatSwitchSession 刷新
 * 中途用空列表重绘（避免闪烁/清空），此时用缓存渲染，否则点「＋ 新会话」
 * 会把所有已有标签覆盖掉，只剩新的待发送会话 */
let CHAT_TABS_CACHE = [];

function renderChatTabs(list){
  const bar = $('chat-tabs'); if(!bar) return;
  bar.innerHTML = '';
  if(list.length) CHAT_TABS_CACHE = list;
  else if(CHAT_TABS_CACHE.length) list = CHAT_TABS_CACHE;
  const ids = list.map(s => s.id || 'default');
  /* 当前会话的标签必须无条件可见：新建会话在后端注册前、发送首条消息后
   * 的刷新空档，服务端列表都还不含它——缺失即补上，否则标签会被列表
   * 重绘"覆盖"掉（新会话闪现后消失，或旧标签全被清空只剩新的）。 */
  if(!ids.includes(CHAT_SESSION)) ids.push(CHAT_SESSION);
  ids.forEach(id => {
    const info = list.find(s => (s.id || 'default') === id);
    const tab = document.createElement('span');
    tab.className = 'chat-tab' + (id === CHAT_SESSION ? ' on' : '');
    const name = document.createElement('span');
    name.className = 'name';
    const label = (info && info.title) ? info.title : (id === 'default' ? '默认会话' : id);
    name.textContent = label.length > 18 ? label.slice(0, 18) + '…' : label;
    name.title = chatSessionTip(info, id);
    tab.appendChild(name);
    if(info && info.turns != null){
      const n = document.createElement('span');
      n.style.cssText = 'color:var(--muted);font-size:11px';
      n.textContent = info.turns;
      tab.appendChild(n);
    }
    const del = document.createElement('button');
    del.className = 'del'; del.title = '清空该会话（保留会话）'; del.textContent = '×';
    del.onclick = async (e) => { e.stopPropagation(); await chatClearSession(id); };
    tab.appendChild(del);
    /* issue #24: 彻底删除会话（含聊天记录文件），与「×清空」区分 */
    const rm = document.createElement('button');
    rm.className = 'del'; rm.title = '删除该会话（含聊天记录，不可恢复）'; rm.textContent = '🗑';
    rm.style.marginLeft = '2px';
    rm.onclick = async (e) => { e.stopPropagation(); await chatDeleteSession(id); };
    tab.appendChild(rm);
    tab.onclick = () => chatSwitchSession(id);
    bar.appendChild(tab);
  });
  const plus = document.createElement('span');
  plus.className = 'chat-tab new';
  plus.textContent = '＋ 新会话';
  plus.onclick = chatNewSession;
  bar.appendChild(plus);
  sideRecent(list);
  syncChatSettings();
}

/* 会话提示文本：标题 / 轮次 / 创建时间 / 累计执行时长 / 共享记忆 */
function chatSessionTip(info, id){
  if(!info) return id;
  const bits = [];
  bits.push((info.title || id) + '（' + (info.turns || 0) + ' 轮）');
  if(info.created_ms) bits.push('创建 ' + new Date(info.created_ms).toLocaleString());
  if(info.total_ms) bits.push('累计执行 ' + fmtDur(info.total_ms));
  bits.push(info.shared_memory === false ? '记忆：私有' : '记忆：共享');
  return bits.join(' · ');
}

/* 侧边栏「最近」会话列表（ChatGPT 风格）：新建的会话自动归档到这里 */
function sideRecent(list){
  const box = $('side-recent'); if(!box) return;
  box.innerHTML = '';
  const ids = list.map(s => s.id || 'default');
  if(!ids.includes(CHAT_SESSION)) ids.push(CHAT_SESSION);
  ids.slice(-12).forEach(id => {
    const info = list.find(s => (s.id || 'default') === id);
    const b = document.createElement('button');
    b.className = id === CHAT_SESSION ? 'on' : '';
    const label = (info && info.title) ? info.title : (id === 'default' ? '默认会话' : id);
    b.textContent = label.length > 16 ? label.slice(0, 16) + '…' : label;
    b.title = chatSessionTip(info, id);
    b.onclick = () => { if(id !== CHAT_SESSION){ chatSwitchSession(id); } else { switchPanel('chat'); } };
    box.appendChild(b);
  });
}

/* ===== 新聊天设置区（模型配置 / 共享记忆）===== */

function chatToggleSettings(){
  const el = $('chat-settings');
  if(el) el.style.display = el.style.display === 'none' ? '' : 'none';
}

/* 用当前会话信息同步设置区（共享记忆勾选 + 会话元数据） */
function syncChatSettings(){
  const info = CHAT_TABS_CACHE.find(s => (s.id || 'default') === CHAT_SESSION);
  const cb = $('chat-shared');
  if(cb) cb.checked = !(info && info.shared_memory === false);
  const meta = $('chat-session-meta');
  if(meta){
    const bits = [];
    if(info && info.created_ms) bits.push('创建 ' + new Date(info.created_ms).toLocaleString());
    if(info && info.total_ms) bits.push('累计执行 ' + fmtDur(info.total_ms));
    meta.textContent = bits.length ? bits.join(' · ') : '新会话';
  }
}

/* 共享记忆开关 → POST /v1/chat/sessions/<id>/shared */
async function chatSharedToggle(shared){
  const r = await call('POST', '/v1/chat/sessions/' + encodeURIComponent(CHAT_SESSION) + '/shared', {shared: !!shared});
  if(r.status < 300){
    toast(shared ? '已共享记忆（本会话可读写 Memory OS）' : '已切为私有记忆（本会话不读写 Memory OS）');
    const info = CHAT_TABS_CACHE.find(s => (s.id || 'default') === CHAT_SESSION);
    if(info) info.shared_memory = shared ? 1 : 0;
  } else {
    toast('设置失败：' + (r.obj && r.obj.error || r.status));
    syncChatSettings();
  }
}

/* ===== 模型配置门禁：未配置模型不能使用新聊天 ===== */

async function chatGateCheck(){
  const gate = $('chat-gate'), send = $('chat-send'), input = $('chat-input');
  let ok = false, prov = '', keySet = false;
  try {
    const r = await call('GET', '/v1/config/llm');
    const o = r.obj || {};
    prov = o.provider || '';
    keySet = !!o.api_key_set;
    ok = !!(prov && prov !== 'mock' && keySet);
  } catch(e) {}
  if(gate) gate.style.display = ok ? 'none' : '';
  if(send) send.disabled = !ok;
  if(input) input.disabled = !ok;
  return ok;
}

async function chatLoadHistory(){
  const box = $('chat-box'); if(!box) return;
  // 先回放本地缓存（切页/切会话不闪空），再让服务端历史兜底刷新
  const cached = CHAT_CACHE[CHAT_SESSION];
  if(cached && cached.length && !CHAT_MSGS.length){ CHAT_MSGS = cached; chatRedraw(); }
  // 有进行中的回复时不要用服务端历史覆盖本地视图（本轮 q/a 还没入库）
  if(CHAT_MSGS.some(m => m.pending)){ return; }
  const session = CHAT_SESSION;
  const r = await call('GET', '/v1/chat/history?session=' + encodeURIComponent(session));
  if(session !== CHAT_SESSION || chatIsBusy(session)) return;
  if(r.status !== 200 || !r.obj || !Array.isArray(r.obj.turns)) return;
  const turns = r.obj.turns;
  CHAT_MSGS = [];
  turns.forEach(t => { if(t.q) CHAT_MSGS.push({role:'user', text:t.q, pending:false, el:null});
                       if(t.a) CHAT_MSGS.push({role:'bot',  text:t.a, pending:false, el:null}); });
  chatRedraw();
}

async function chatSwitchSession(id){
  if(id === CHAT_SESSION) return;
  chatCacheStore(); // 保存当前会话消息，切回时即时回放
  CHAT_SESSION = id;
  CHAT_NEW_SESSION = false;
  CHAT_MSGS = [];
  renderChatTabs([]);
  await chatLoadHistory();
  loadChatSessions();
  chatGateCheck();
  /* issue #22: 切回的会话若任务仍在执行，恢复「取消」按钮与状态行 */
  syncChatTaskId();
  if(chatIsBusy(id)){
    const st = $('chat-status');
    if(st) st.textContent = '任务执行中…';
  }
}

async function chatNewSession(){
  chatCacheStore(); // 保存当前会话消息（切回时即时回放）；旧会话自动归档到「最近」
  /* 生成随机 UUID 会话 id（后端创建并持久化），失败则回退到本地临时 id */
  const r = await call('POST', '/v1/chat/sessions');
  const id = r.obj && r.obj.id;
  CHAT_SESSION = id || ('s-' + Date.now());
  CHAT_NEW_SESSION = !id; /* 后端已注册时无需等首条消息 */
  CHAT_MSGS = [];
  renderChatTabs([]);
  const box = $('chat-box'); if(box) box.innerHTML = '';
  updateChatHero();
  const ok = await chatGateCheck();
  const st = $('chat-status');
  if(st) st.textContent = ok ? ('新会话 ' + (id ? '' : '（临时）')) + '：已就绪' : '尚未配置模型，请在上方设置里先配置对话模型';
  fillChatModelSelect();
  syncChatTaskId(); /* 新会话无任务，隐藏「取消」按钮 */
}

async function chatClearSession(id){
  if(chatIsBusy(id)){ toast('该会话任务执行中，请先取消或等待完成'); return; }
  await call('DELETE', '/v1/chat/sessions/' + encodeURIComponent(id));
  if(id === CHAT_SESSION){
    CHAT_MSGS = [];
    const box = $('chat-box'); if(box) box.innerHTML = '';
  }
  CHAT_NEW_SESSION = false;
  loadChatSessions();
  toast(id === 'default' ? '默认会话已清空' : ('会话 ' + id + ' 已清空'));
}

/* issue #24: 彻底删除会话（注册表 + 元数据索引 + 聊天记录文件），与「清空」不同 */
async function chatDeleteSession(id){
  const label = id === 'default' ? '默认会话' : ('会话 ' + id);
  if(!confirm('删除' + label + '及其全部聊天记录？此操作不可恢复（「×」仅清空记录，会话保留）。')) return;
  if(chatIsBusy(id)){ toast('该会话任务执行中，请先取消或等待完成'); return; }
  const r = await call('POST', '/v1/chat/sessions/' + encodeURIComponent(id) + '/delete', {});
  if(r.status >= 300){ toast('删除失败：' + ((r.obj && r.obj.error) || r.status)); return; }
  delete CHAT_CACHE[id];
  if(id === CHAT_SESSION){
    CHAT_TABS_CACHE = CHAT_TABS_CACHE.filter(s => (s.id || 'default') !== id);
    const rest = CHAT_TABS_CACHE;
    const nid = rest.length ? (rest[rest.length - 1].id || 'default') : 'default';
    await chatSwitchSession(nid);
  } else {
    CHAT_TABS_CACHE = CHAT_TABS_CACHE.filter(s => (s.id || 'default') !== id);
    renderChatTabs([]);
  }
  loadChatSessions();
  toast(label + '已删除');
}

function chatAddBubble(role, text, push = true){
  const box = $('chat-box'); if(!box) return null;
  const wrap = document.createElement('div');
  wrap.className = 'chat-message ' + role;
  if(role === 'bot'){
    const pre = document.createElement('pre');
    pre.className = 'chat-answer';
    pre.textContent = text;
    wrap.appendChild(pre);
  } else {
    wrap.textContent = text;
  }
  const copy = document.createElement('button');
  copy.className = 'chat-copy'; copy.type = 'button'; copy.textContent = '复制';
  copy.title = '复制这条消息';
  copy.onclick = () => copyText((role === 'bot' ? wrap.querySelector('.chat-answer')?.textContent : text) || text || '');
  wrap.appendChild(copy);
  box.appendChild(wrap);
  if(push) CHAT_MSGS.push({role, text, pending:false, el:wrap});
  updateChatHero();
  chatScroll();
  return wrap;
}

/* ChatGPT 首页体验：还没有消息时显示居中问候语 + 建议项 */
function updateChatHero(){
  const h = $('chat-hero');
  if(h) h.style.display = ($('chat-box') && $('chat-box').children.length) ? 'none' : '';
}

function chatSuggest(text){
  const input = $('chat-input');
  if(!input) return;
  input.value = text;
  chatSend();
}

function chatScroll(force = false){
  const box = $('chat-box');
  if(box && (force || chatNearBottom())) box.scrollTop = box.scrollHeight;
}

let CHAT_ROUND = 0;
let CHAT_TASK_ID = null; /* 当前会话运行中的任务 id（供「取消」按钮使用） */
let CHAT_RESUME_OK = false; /* 最近一次任务以取消/失败/超时结束，可「恢复」 */
/* issue #21/#22: 会话 → 运行中任务 的映射。执行任务不再全局锁死 UI：
 * 切会话 / 切面板 / 新建会话随时可用，每个会话独立跟踪自己的任务；
 * 任务终态时从映射中移除。 */
const CHAT_TASKS = {}; /* sessionId → running taskId */
function chatTaskOf(sess){ return Object.prototype.hasOwnProperty.call(CHAT_TASKS,sess) ? CHAT_TASKS[sess] : null; }
function chatIsBusy(sess){ const id = sess === undefined ? CHAT_SESSION : sess; return chatTaskOf(id) !== null || CHAT_SUBMITTING.has(id); }
/* 当前会话的任务状态同步到 CHAT_TASK_ID / 取消按钮（切会话、切回面板时调用） */
function syncChatTaskId(){
  CHAT_TASK_ID = chatTaskOf(CHAT_SESSION);
  CHAT_RESUME_OK = false;
  chatBusyUI(CHAT_TASK_ID !== null);
}

function chatBusyUI(busy){
  const cancel = $('chat-cancel'), resume = $('chat-resume');
  const send = $('chat-send'); if(send) send.disabled = CHAT_SUBMITTING.has(CHAT_SESSION) || !!$('chat-input')?.disabled;
  if(cancel) cancel.style.display = (busy && CHAT_TASK_ID !== null) ? '' : 'none';
  if(resume) resume.style.display = (!busy && CHAT_RESUME_OK) ? '' : 'none';
}

/* Flow 容器任务进度：各节点执行状态（flow_nodes 来自 /v1/tasks/<id>） */
function flowNodesText(t){
  if(!t || !Array.isArray(t.flow_nodes) || !t.flow_nodes.length) return '';
  const ICON = {queued:'⏸', running:'⏳', ok:'✓', error:'✗'};
  const now = Date.now();
  return t.flow_nodes.map(n => {
    let state = n.status === 'running'
      ? (n.cur_tool ? '正在执行 ' + n.cur_tool : (n.round ? '正在规划第 ' + n.round + ' 轮' : '正在启动'))
      : ({queued:'等待中', ok:'已完成', error:'失败'}[n.status] || n.status || '未知');
    let s = (n.id || '?') + ' ' + (ICON[n.status] || '·') + ' ' + state;
    let ms = 0;
    if(n.status === 'running' && n.start_ms) ms = now - n.start_ms;
    else if((n.status === 'ok' || n.status === 'error') && n.start_ms && n.end_ms) ms = n.end_ms - n.start_ms;
    if(ms > 0) s += ' ' + Math.floor(ms / 1000) + 's';
    /* 运行中节点显示引擎内部进度：第N轮 · 工具×N（当前工具） · LLM 耗时 */
    if(n.status === 'running'){
      const d = [];
      if(n.round) d.push('第' + n.round + '轮');
      if(n.tool_calls !== undefined) d.push('已调用工具 ' + (n.tool_calls || 0) + ' 次');
      if(n.llm_ms) d.push('LLM ' + Math.floor(n.llm_ms / 1000) + 's');
      if(d.length) s += ' · ' + d.join(' · ');
    }
    return s;
  }).join(' · ');
}

/* 任务实时进度行：耗时 / 轮次 / 工具调用 / token —— 数据来自
 * /v1/tasks/<id> 的 live 进度字段（RUNNING 时返回） */
function taskProgressText(t){
  if(!t) return '';
  /* Flow 容器任务：引擎计数器恒为 0，显示节点级进度才有意义 */
  if(t.flow_nodes) return flowNodesText(t);
  const bits = [];
  if(t.elapsed_ms !== undefined){
    const sec = Math.floor((t.elapsed_ms || 0) / 1000);
    bits.push(Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'));
  }
  if(t.round) bits.push('第' + t.round + '轮');
  if(t.tool_calls !== undefined) bits.push('工具×' + (t.tool_calls || 0) + (t.cur_tool ? '（' + t.cur_tool + '）' : ''));
  if(t.llm_ms !== undefined){
    const ls = ((t.llm_ms || 0) / 1000).toFixed(1);
    const ts = ((t.tool_ms || 0) / 1000).toFixed(1);
    bits.push('LLM ' + ls + 's×' + (t.llm_calls || 0) + ' · 工具 ' + ts + 's');
  }
  if(t.tokens_in || t.tokens_out)
    bits.push('tokens ' + (t.tokens_in + t.tokens_out) + '（↑' + t.tokens_in + ' ↓' + t.tokens_out + '）');
  return bits.join(' · ');
}

/* Claude-Code 风格步骤化执行显示：● Tool(args) + ⎿ 输出首行摘要（不刷屏）；
 * RUNNING 时末尾显示 ⏳ 思考中…；无步骤数据时回退到过程日志尾部。
 * Flow 容器任务：显示运行中节点（stepN:agent）已执行的步骤 */
function stepLines(s){
  const mark = s.ok === 1 ? '●' : (s.ok === 0 ? '✗' : '⊘');
  const args = (s.args || '').replace(/\s+/g, ' ').trim();
  const out = (s.out || '').split('\n').map(x => x.trim()).filter(Boolean)[0] || '';
  const outClean = out.replace(/^\[[^\]]+\]\s*/, '');
  const ls = [mark + ' ' + (s.tool || '?') + '(' + (args.length > 90 ? args.slice(0, 90) + '…' : args) + ')'];
  if(outClean) ls.push('  ⎿ ' + (outClean.length > 110 ? outClean.slice(0, 110) + '…' : outClean));
  return ls;
}
function flowRunningNodes(t){
  return (t && Array.isArray(t.flow_nodes))
    ? t.flow_nodes.filter(n => n.status === 'running' && n.steps && n.steps.length) : [];
}
function stepsText(t){
  const lines = [];
  const frun = flowRunningNodes(t);
  for(const n of frun){
    lines.push('[' + (n.id || '?') + ':' + (n.agent || '') + ']');
    for(const s of n.steps) lines.push(...stepLines(s));
  }
  if(!frun.length){
    const steps = t && t.steps;
    if(steps && steps.length){
      for(const s of steps) lines.push(...stepLines(s));
    } else if(t && t.process_log){
      for(const l of t.process_log.split('\n').filter(x => x.trim()).slice(-25)) lines.push(l);
    }
  }
  if(t && t.status === 'RUNNING') lines.push('⏳ 思考中…');
  return lines.join('\n');
}

async function uploadBlob(name, blob){
  const st = $('chat-status');
  if(st) st.textContent = '上传中: ' + name + '…';
  try {
    const resp = await fetch('/v1/upload?name=' + encodeURIComponent(name), {method:'POST', body: blob});

      CHAT_ATTACH.push({name: obj.name || name});
      chatAttachRender();
      toast('已添加附件 ' + (obj.name || name));
    } else {
      toast('上传失败: ' + (obj.error || ('HTTP ' + resp.status)));

/* 粘贴图片（clipboardData 里的文件项）+ 整个聊天区拖拽文件 */
function chatInitDrop(){
  const input = $('chat-input');
  const wrap = $('chat-wrap');
  if(!input || !wrap || wrap.dataset.dropInit) return;
  wrap.dataset.dropInit = '1';
  input.addEventListener('paste', (e) => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    let handled = false;
    for(const it of items){
      if(it.kind === 'file'){
        const f = it.getAsFile();
        if(f){
          handled = true;
          const name = f.name || ('粘贴图片-' + new Date().toISOString().replace(/[:.]/g, '-') + '.png');
          uploadBlob(name, f);
        }
      }
    }
    if(handled) e.preventDefault();
  });
  ['dragenter', 'dragover'].forEach(ev =>
    wrap.addEventListener(ev, (e) => { e.preventDefault(); wrap.classList.add('drop'); }));
  ['dragleave', 'drop'].forEach(ev =>
    wrap.addEventListener(ev, (e) => {
      e.preventDefault();
      if(ev === 'dragleave' && e.target !== wrap) return; /* 内部元素间移动不算离开 */
      wrap.classList.remove('drop');
    }));
  wrap.addEventListener('drop', (e) => {
    const files = (e.dataTransfer && e.dataTransfer.files) || [];
    for(const f of files) uploadBlob(f.name, f);
  });
}

async function loadUploads(){

/* ================= Flow（自动编排 + 手写 DAG） ================= */

let FLOW_BUSY = false;

/* Flow 面板状态镜像：switchPanel 用 innerHTML 重建面板，DOM 里的任务输入、
 * DAG 编辑器、执行输出和状态行（耗时/token/工具统计）在切换后全部丢失。
 * 镜像保存在 JS 变量里，切回面板时恢复；轮询循环通过 flowStatus 同时写
 * 镜像和（若存在的）当前 DOM 元素，即使人不在 Flow 页统计也不丢。 */
let FLOW_MIRROR = {task:'', json:'', out:'', gen:'', run:'', follow:''};

/* which: 'gen-status' | 'status' | 'follow-status'（对应 flow-*-status 元素）。
 * 每次都用 $() 现查元素：面板被 innerHTML 重建后，轮询循环里捕获的旧节点
 * 已脱离文档，写它无效；现查则切回面板后统计行继续实时刷新。 */
function flowStatus(which, text){
  FLOW_MIRROR[which === 'gen-status' ? 'gen' : which === 'follow-status' ? 'follow' : 'run'] = text;
  const el = $('flow-' + which);
  if(el) el.textContent = text;
}

function flowSaveState(){
  const t = $('flow-task'), j = $('flow-json'), o = $('flow-out');
  if(t) FLOW_MIRROR.task = t.value;
  if(j) FLOW_MIRROR.json = j.value;
  if(o && o.textContent) FLOW_MIRROR.out = o.textContent;
}

function flowRestoreState(){
  const t = $('flow-task'), j = $('flow-json'), o = $('flow-out');
  if(t && FLOW_MIRROR.task) t.value = FLOW_MIRROR.task;
  if(j && FLOW_MIRROR.json) j.value = FLOW_MIRROR.json;
  flowStatus('gen-status', FLOW_MIRROR.gen || '');
  flowStatus('status', FLOW_MIRROR.run || '');
  flowStatus('follow-status', FLOW_MIRROR.follow || '');
  if(o && FLOW_MIRROR.out) o.textContent = FLOW_MIRROR.out;
}

/* 生成 DAG：LLM 分解总任务 → 填入下方编辑器（不执行，可修改） */
async function flowGen(){
  const input = $('flow-task'), st = $('flow-gen-status'), ta = $('flow-json');
  if(!input || !st) return;
  const task = input.value.trim();
  if(!task){ flowStatus('gen-status', '请先输入总任务'); return; }
  flowStatus('gen-status', '分解中…');
  const c = await call('POST', '/v1/flows/decompose', {task});
  if(c.status === 200 && c.obj && c.obj.dag){
    if(ta) ta.value = JSON.stringify(c.obj.dag, null, 2);
    flowStatus('gen-status', '已生成，可在下方修改后执行');
  } else {
    flowStatus('gen-status', '生成失败: ' + ((c.obj && c.obj.error) || c.text || ('HTTP ' + c.status)));
  }
}

/* 自动执行：分解→执行→综合答案一步完成 */
async function flowAuto(){
  if(FLOW_BUSY) return;
  const input = $('flow-task'), st = $('flow-gen-status'), out = $('flow-out');
  if(!input) return;
  const task = input.value.trim();
  if(!task){ flowStatus('gen-status', '请先输入总任务'); return; }
  FLOW_BUSY = true;
  flowStatus('gen-status', '已提交（分解→执行→综合）…');
  FLOW_MIRROR.out = '';
  if(out) out.textContent = '';
  const c = await call('POST', '/v1/orchestrate', {task});
  const id = c.obj && c.obj.id;
  if(id === undefined){
    flowStatus('gen-status', '提交失败: ' + (c.text || ('HTTP ' + c.status)));
    FLOW_BUSY = false;
    return;
  }
  for(let i = 0; ; i++){
    const r = await call('GET', '/v1/tasks/' + id);
    if(r.status === 404){
      flowStatus('gen-status', '任务丢失（服务可能已重启），请重新提交');
      toast('任务丢失（服务可能已重启）');
      FLOW_BUSY = false;
      return;
    }
    const t = r.obj;
    if(t && t.status && t.status !== 'DONE')
      flowStatus('gen-status', '状态: ' + t.status + (taskProgressText(t) ? ' · ' + taskProgressText(t) : ''));
    if(t && (t.status === 'DONE' || t.status === 'FAILED' || t.status === 'CANCELLED' || t.status === 'TIMEOUT')){
      FLOW_LAST_OUTPUT = t.output || '';
      FLOW_MIRROR.out = FLOW_LAST_OUTPUT ? ('—— 综合答案 ——\n' + FLOW_LAST_OUTPUT) : '(无输出)';
      if(out && out.isConnected) out.textContent = FLOW_MIRROR.out;
      const zh = {FAILED: '失败', CANCELLED: '已取消', TIMEOUT: '超时'}[t.status];
      if(zh){
        flowStatus('gen-status', '❌ 任务' + zh + (FLOW_LAST_OUTPUT && FLOW_LAST_OUTPUT !== '(no output)' ? '：' + FLOW_LAST_OUTPUT.slice(0, 300) : '（无输出）'));
        toast('任务' + zh);
      } else {
        flowStatus('gen-status', '');
      }
      FLOW_BUSY = false;
      loadFlow();
      return;
    }
    await new Promise(res => setTimeout(res, 300));
  } /* poll until terminal status — no timeout */
}

async function loadFlow(){

      parts.push('<details style="margin:8px 0"' + (k === 'flow/trace' ? '' : ' open') + '>' +

        esc(value) + '</pre></details>');
